/* ── boot ─────────────────────────────────────────────────────────────── */
(async function boot(){
  if(!TOK){ return renderState('err','invalidTitle','invalidBody'); }
  try{
    // Stateless client on purpose: this page is served from the same origin as the
    // dietitian app, which persists its Supabase auth session to localStorage. Without
    // this, createClient() would silently adopt whatever dietitian is logged in on this
    // browser and run every call as them. The client form must always be anonymous and
    // reach the data only through the get_intake / submit_intake RPCs.
    sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{
      auth:{ persistSession:false, autoRefreshToken:false, detectSessionInUrl:false }
    });
  }catch(e){ return renderState('err','netTitle','netErr'); }
  let data,error;
  try{
    ({data,error}=await sb.rpc('get_intake',{p_token:TOK}));
  }catch(e){ return renderState('err','netTitle','netErr'); }
  if(error){ console.error('[intake] get_intake',error); return renderState('err','netTitle','netErr'); }
  if(!data){ return renderState('err','invalidTitle','invalidBody'); }

  L=(data.lang==='en')?'en':'el';
  document.documentElement.lang=L;
  PREFILL=data.prefill||{};
  const langbar=el('langbar'); if(langbar){ langbar.hidden=false; syncLangbar(); }

  if(data.status==='submitted'){ return renderState('ok','lockedTitle','lockedBody', data.submitted_at); }
  if(data.status==='superseded'){ return renderState('warn','supersededTitle','supersededBody'); }
  if(data.status!=='sent'){ return renderState('err','invalidTitle','invalidBody'); }

  renderForm(data.client_name||PREFILL.name||'');
})();

function syncLangbar(){
  document.querySelectorAll('#langbar button').forEach(function(b){
    b.setAttribute('aria-pressed', b.dataset.l===L ? 'true':'false');
  });
}
function setLang(l){
  if(l===L) return;
  L=l; document.documentElement.lang=L; syncLangbar();
  const snap=collect(); renderForm(snap.profile.name||''); applyDraft(snap);
}

  const badge = kind==='ok'?'✓' : kind==='warn'?'!' : '×';
  let stampHtml='';
  if(stamp){
    const d=new Date(stamp);
    if(!isNaN(d)) stampHtml='<p style="font-size:.8rem;color:var(--faint);margin-top:14px">'+esc(d.toLocaleString(L==='en'?'en-GB':'el-GR',{day:'numeric',month:'long',year:'numeric',hour:'2-digit',minute:'2-digit'}))+'</p>';
  }
  el('root').innerHTML =
    '<div class="state">'+
      '<div class="big '+(kind==='ok'?'':kind)+'">'+badge+'</div>'+
      '<h1>'+esc(T(titleK))+'</h1>'+
      '<p>'+esc(T(bodyK))+'</p>'+ stampHtml +
    '</div>';
}

    /* profile */
    '<div class="card"><h2>'+esc(T('secProfile'))+'</h2>'+
      '<div class="fg"><label class="lbl" for="f-name">'+esc(T('name'))+'</label><input type="text" id="f-name" value="'+esc(nameVal||'')+'"></div>'+
      '<div class="row2">'+
        '<div class="fg"><label class="lbl" for="f-birth">'+esc(T('birth'))+'</label><input type="date" id="f-birth" value="'+esc(birthVal)+'" max="'+new Date().toISOString().slice(0,10)+'"></div>'+
        '<div class="fg"><label class="lbl" for="f-height">'+esc(T('height'))+'</label><input type="number" id="f-height" inputmode="numeric" min="90" max="230" value="'+esc(heightVal)+'"></div>'+
      '</div>'+
      '<div class="fg"><label class="lbl" for="f-weight">'+esc(T('weightToday'))+' <span class="opt">— '+esc(T('optional'))+'</span></label><input type="number" id="f-weight" inputmode="decimal" min="25" max="400" step="0.1"></div>'+
    '</div>'+

    /* goal */
    '<div class="card"><h2>'+esc(T('secGoal'))+'</h2>'+
      '<div class="chips" role="radiogroup" id="grp-goal">'+GOALS.map(function(g){return chip('goal',g,GKEYS[g],true);}).join('')+'</div>'+
      '<div class="fg" id="goal-other-wrap" style="display:none;margin-top:12px"><label class="lbl" for="f-goal-other">'+esc(T('goalOther'))+'</label><input type="text" id="f-goal-other"></div>'+
      '<p class="err-inline" id="err-goal">'+esc(T('reqGoal'))+'</p>'+
    '</div>'+

    /* medical */
    '<div class="card"><h2>'+esc(T('secMedical'))+'</h2>'+
      '<div class="fg"><div class="chips" id="grp-cond">'+
        CONDS.map(function(k){return chip('cond',k,CKEYS[k],false);}).join('')+
        chip('cond','none','c_none',false)+
      '</div></div>'+
      '<div class="fg"><label class="lbl">'+esc(T('preg'))+'</label>'+
        '<div class="chips" role="radiogroup" id="grp-preg">'+
          chip('preg','yes','yes',true)+chip('preg','no','no',true)+
        '</div></div>'+
      fieldArea('f-meds','meds')+
      '<div style="margin-top:-8px"><span class="hint">'+esc(T('medsPh'))+'</span></div>'+
    '</div>'+

    /* allergies */
    '<div class="card"><h2>'+esc(T('secAllergy'))+'</h2>'+
      '<div class="fg"><div class="chips" id="grp-allergy">'+ALLERGS.map(function(k){return chip('allergy',k,AKEYS[k],false);}).join('')+'</div></div>'+
      fieldText('f-allergy-other','allergyOther',null,true)+
      '<p class="hint">'+esc(T('allergyNote'))+'</p>'+
    '</div>'+

    /* avoid */
    '<div class="card"><h2>'+esc(T('secAvoid'))+'</h2>'+
      '<div class="chips" id="grp-avoid">'+
        AVOIDS.map(function(k){return chip('avoid',k,VKEYS[k],false);}).join('')+
        chip('avoid','none','v_none',false)+
      '</div>'+
    '</div>'+

    /* habits */
    '<div class="card"><h2>'+esc(T('secHabits'))+'</h2>'+
      '<div class="row2">'+
        '<div class="fg"><label class="lbl" for="f-meals">'+esc(T('mealsPerDay'))+'</label><input type="number" id="f-meals" inputmode="numeric" min="1" max="8" value="3"></div>'+
        '<div class="fg"><label class="lbl" for="f-cooking">'+esc(T('cooking'))+'</label><select id="f-cooking"><option value="home">'+esc(T('ck_home'))+'</option><option value="mixed">'+esc(T('ck_mixed'))+'</option><option value="out">'+esc(T('ck_out'))+'</option></select></div>'+
      '</div>'+
      '<div class="fg"><label class="lbl">'+esc(T('breakfast'))+'</label>'+
        '<div class="chips" role="radiogroup" id="grp-breakfast">'+
          chip('breakfast','yes','b_yes',true)+chip('breakfast','sometimes','b_sometimes',true)+chip('breakfast','no','b_no',true)+
        '</div></div>'+
      fieldText('f-hunger','hunger','hungerPh')+
      '<div class="row2">'+
        '<div class="fg"><label class="lbl" for="f-water">'+esc(T('water'))+'</label><input type="text" id="f-water" placeholder="'+esc(T('waterPh'))+'"></div>'+
        '<div class="fg"><label class="lbl" for="f-sleep">'+esc(T('sleep'))+'</label><input type="text" id="f-sleep" placeholder="'+esc(T('sleepPh'))+'"></div>'+
      '</div>'+
      fieldText('f-exercise','exercise','exercisePh')+
    '</div>'+

    /* preferences */
    '<div class="card"><h2>'+esc(T('secLikes'))+'</h2>'+
      fieldArea('f-likes','likes')+fieldArea('f-dislikes','dislikes')+fieldArea('f-note','note')+
    '</div>'+

    '<button type="button" class="btn" id="submitBtn" onclick="doSubmit()">'+esc(T('submit'))+'</button>'+
    '<p class="hint" style="text-align:center;margin-top:10px">'+esc(T('submitNote'))+'</p>'+
    '<p class="err-inline" id="err-name" style="text-align:center">'+esc(T('reqName'))+'</p>'+
    '<p class="err-inline" id="err-net" style="text-align:center">'+esc(T('netErr'))+'</p>';

  if(foot){ foot.hidden=false; foot.textContent=T('privacy'); }

  // restore any draft
  const saved=loadDraft();
  if(saved) applyDraft(saved);

  // autosave wiring
  document.querySelectorAll('#root input,#root textarea,#root select').forEach(function(node){
    node.addEventListener('input', queueSave);
    node.addEventListener('change', queueSave);
  });
}

function toggleChip(btn,radio){
  if(radio){
    const grp=btn.parentElement;
    grp.querySelectorAll('.chip').forEach(function(c){ c.setAttribute('aria-pressed','false'); });
    btn.setAttribute('aria-pressed','true');
    if(btn.dataset.g==='goal'){
      el('goal-other-wrap').style.display = (btn.dataset.v==='other')?'block':'none';
    }
  } else {
    const on = btn.getAttribute('aria-pressed')==='true';
    btn.setAttribute('aria-pressed', on?'false':'true');
    // "none" chips are mutually exclusive with the rest of their group
    const grp=btn.parentElement;
    if(btn.dataset.v==='none' && !on){
      grp.querySelectorAll('.chip').forEach(function(c){ if(c!==btn) c.setAttribute('aria-pressed','false'); });
    } else if(btn.dataset.v!=='none' && !on){
      const none=grp.querySelector('.chip[data-v="none"]'); if(none) none.setAttribute('aria-pressed','false');
    }
  }
  queueSave();
}

/* ── collect / draft ──────────────────────────────────────────────────── */
function pressed(groupId){
  return Array.from(document.querySelectorAll('#'+groupId+' .chip[aria-pressed="true"]')).map(function(c){return c.dataset.v;});
}
function radioVal(groupId){
  const c=document.querySelector('#'+groupId+' .chip[aria-pressed="true"]');
  return c?c.dataset.v:'';
}
function val(id){ const n=el(id); return n?n.value.trim():''; }
function numOrNull(id){ const n=el(id); if(!n||n.value==='') return null; const x=parseFloat(n.value); return isNaN(x)?null:x; }

function collect(){
  return {
    v:1, submittedVia:'intake.html', lang:L,
    profile:{ name:val('f-name'), birthDate:val('f-birth'), heightCm:numOrNull('f-height'), weightKg:numOrNull('f-weight') },
    goal:radioVal('grp-goal'), goalOther:val('f-goal-other'),
    conditions:pressed('grp-cond'),
    pregnancyBreastfeeding: radioVal('grp-preg')==='yes',
    meds:val('f-meds'),
    allergies:pressed('grp-allergy'), allergiesOther:val('f-allergy-other'),
    avoid:pressed('grp-avoid'),
    habits:{
      mealsPerDay:numOrNull('f-meals'), breakfast:radioVal('grp-breakfast'),
      hungerTime:val('f-hunger'), cooking:(el('f-cooking')||{}).value||'',
      water:val('f-water'), sleep:val('f-sleep'), exercise:val('f-exercise')
    },
    likes:val('f-likes'), dislikes:val('f-dislikes'), note:val('f-note')
  };
}

let saveTimer=null;
function queueSave(){
  const pill=el('savepill');
  clearTimeout(saveTimer);
  saveTimer=setTimeout(function(){
    try{ localStorage.setItem(DRAFT_KEY, JSON.stringify(collect())); }catch(e){}
    if(pill){ pill.classList.add('on'); clearTimeout(pill._t); pill._t=setTimeout(function(){pill.classList.remove('on');},1400); }
  },450);
}
function loadDraft(){
  try{ const raw=localStorage.getItem(DRAFT_KEY); return raw?JSON.parse(raw):null; }catch(e){ return null; }
}
function setChipGroup(groupId,vals){
  const set=new Set(vals||[]);
  document.querySelectorAll('#'+groupId+' .chip').forEach(function(c){
    c.setAttribute('aria-pressed', set.has(c.dataset.v)?'true':'false');
  });
}
function applyDraft(d){
  if(!d) return;
  const P=d.profile||{};
  if(el('f-name')&&P.name) el('f-name').value=P.name;
  if(el('f-birth')&&P.birthDate) el('f-birth').value=P.birthDate;
  if(el('f-height')&&P.heightCm!=null) el('f-height').value=P.heightCm;
  if(el('f-weight')&&P.weightKg!=null) el('f-weight').value=P.weightKg;
  if(d.goal){ setChipGroup('grp-goal',[d.goal]); if(d.goal==='other') el('goal-other-wrap').style.display='block'; }
  if(el('f-goal-other')&&d.goalOther) el('f-goal-other').value=d.goalOther;
  setChipGroup('grp-cond',d.conditions);
  setChipGroup('grp-preg',[d.pregnancyBreastfeeding?'yes':'no']);
  if(el('f-meds')&&d.meds) el('f-meds').value=d.meds;
  setChipGroup('grp-allergy',d.allergies);
  if(el('f-allergy-other')&&d.allergiesOther) el('f-allergy-other').value=d.allergiesOther;
  setChipGroup('grp-avoid',d.avoid);
  const H=d.habits||{};
  if(el('f-meals')&&H.mealsPerDay!=null) el('f-meals').value=H.mealsPerDay;
  setChipGroup('grp-breakfast',[H.breakfast]);
  if(el('f-hunger')&&H.hungerTime) el('f-hunger').value=H.hungerTime;
  if(el('f-cooking')&&H.cooking) el('f-cooking').value=H.cooking;
  if(el('f-water')&&H.water) el('f-water').value=H.water;
  if(el('f-sleep')&&H.sleep) el('f-sleep').value=H.sleep;
  if(el('f-exercise')&&H.exercise) el('f-exercise').value=H.exercise;
  if(el('f-likes')&&d.likes) el('f-likes').value=d.likes;
  if(el('f-dislikes')&&d.dislikes) el('f-dislikes').value=d.dislikes;
  if(el('f-note')&&d.note) el('f-note').value=d.note;
}

/* ── submit ───────────────────────────────────────────────────────────── */
async function doSubmit(){
  const payload=collect();
  ['err-name','err-goal','err-net'].forEach(function(id){ const n=el(id); if(n) n.classList.remove('on'); });
  { const en=el('err-net'); if(en) en.textContent=T('netErr'); }  // reset any prior too_large / bad_payload text
  if(!payload.profile.name){ el('err-name').classList.add('on'); el('f-name').focus(); return; }
  if(!payload.goal){ el('err-goal').classList.add('on'); return; }

  const btn=el('submitBtn');
  btn.disabled=true; btn.textContent=T('submitting');
  let data,error;
  try{
    ({data,error}=await sb.rpc('submit_intake',{p_token:TOK,p_payload:payload}));
  }catch(e){ error=e; }

  if(error || !data){
    console.error('[intake] submit_intake',error);
    btn.disabled=false; btn.textContent=T('submit');
    el('err-net').classList.add('on');
    return;
  }
  if(data.ok===true){
    try{ localStorage.removeItem(DRAFT_KEY); }catch(e){}
    renderState('ok','thanksTitle','thanksBody', new Date().toISOString());
    window.scrollTo(0,0);
    return;
  }
  // ok:false — reason tells us why
  if(data.reason==='submitted'){ renderState('ok','lockedTitle','lockedBody'); return; }
  if(data.reason==='superseded'){ renderState('warn','supersededTitle','supersededBody'); return; }
  if(data.reason==='not_found'){ renderState('err','invalidTitle','invalidBody'); return; }
  if(data.reason==='too_large' || data.reason==='bad_payload'){
    btn.disabled=false; btn.textContent=T('submit');
    const en=el('err-net'); if(en){ en.textContent=T(data.reason==='too_large'?'tooLong':'badData'); en.classList.add('on'); }
    return;
  }
  btn.disabled=false; btn.textContent=T('submit');
  el('err-net').classList.add('on');
}
</script>
