    sugAggr:'You’re losing quite fast — talk to your dietitian about the calorie deficit.',

    more:'See details ▾', less:'Hide details ▴',
    cmpLbl:'Compare with:', cmpPrev:'Previous', cmpFirst:'First measurement',
    zoneTitle:'📍 Where you stand',
    zoneSub:function(f,band){return 'body fat vs '+(f?'women':'men')+(band?' aged '+band:'');},
    zLow:'low', zHealthy:'healthy', zUp:'raised', zHigh:'high', zYou:'you',
    zRange:function(a,b){return 'Healthy range '+a+'–'+b+'%';},
    zDash:function(l,v){return 'dashed = '+l+' ('+v+'%)';},
    zGoal:function(v){return '◆ goal '+v+'%';}, zSrc:'indicative ranges, not a diagnosis',
    sfTitle:'📐 Where the fat is coming off', sfNote:'Darker green = bigger drop · orange = increase.',
    fbTitle:'📊 Fat (kg) per measurement', hTitle:'🗂 Measurement history',
    hOther:'other method — not compared', hFat:'fat',
    mCaliper:'skinfolds', mEst:'estimate',
    SF:{abdomen:'Abdomen',suprailiac:'Suprailiac',subscapular:'Subscapular',chest:'Chest',midaxillary:'Midaxillary',tricep:'Triceps',thigh:'Thigh',calf:'Calf'},
    footQ:'Questions? Message your dietitian', lock:'personal link — don’t forward it', print:'🖨️ Print / PDF',
    needMoreTitle:'No measurements yet', needMoreBody:'This page will update as soon as your dietitian logs your first measurement.',
    invalidTitle:'Invalid link', invalidBody:'This link was not found. Ask your dietitian for a new one.',
    netTitle:'Something went wrong', netErr:'Connection problem. Check your internet and try again in a moment.'
  }
};
function T(k){ const v=(TXT[L]&&TXT[L][k]!=null)?TXT[L][k]:TXT.el[k]; return v; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m];}); }
function el(id){ return document.getElementById(id); }
function f1(v){ return (+v).toFixed(1); }
function sgn(d,dec){ return (d>0?'+':d<0?'−':'±')+Math.abs(d).toFixed(dec==null?1:dec); }
function fmtDate(iso,short){
  if(!iso)return '';
  const dateOnly=/^\d{4}-\d{2}-\d{2}$/.test(iso);
  const d=new Date(dateOnly?iso+'T00:00:00Z':iso); if(isNaN(d))return '';
  const o=short?{day:'numeric',month:'short'}:{day:'numeric',month:'short',year:'numeric'};
  if(dateOnly)o.timeZone='UTC';
  try{ return new Intl.DateTimeFormat(LOCALE[L]||'el-GR',o).format(d); }catch(e){ return iso.slice(0,10); }
}

/* ── %BF healthy ranges — MIRROR of js/lib/bf-norms.js (GALLAGHER_BF / bfHealthByAge), same
   numbers as the main app and plan.html. Standalone file, no shared script scope, so this
   is a deliberate duplicate — keep values in sync if the source ever changes. ── */
const GALLAGHER_BF={
  M:[{aLo:20,aHi:39,h:[8,19],o:25},{aLo:40,aHi:59,h:[11,21],o:28},{aLo:60,aHi:79,h:[13,24],o:30}],
  F:[{aLo:20,aHi:39,h:[21,32],o:39},{aLo:40,aHi:59,h:[23,33],o:40},{aLo:60,aHi:79,h:[24,35],o:42}]
};
function bfGalRow(sex,age){
  if(!(age>0))return null;
  const rows=GALLAGHER_BF[sex==='F'?'F':'M'];
  const a=age<20?20:(age>79?79:age);
  return rows.find(r=>a>=r.aLo&&a<=r.aHi)||rows[rows.length-1];
}

/* ── comparison logic — ported from js/client-editor/tracker-results.js (not imported:
   this page is standalone). %BF is only ever compared within ONE method: caliper entries
   carry sfProtocol, others bfMethod (bia/dexa/estimate); unknown on either side = comparable. ── */
const NOISE={bf:1, kg:0.3, mass:0.8};
function mOf(e){ return e?(e.sfProtocol?'caliper':(e.bfMethod||'')):''; }
function mism(a,b){ const x=mOf(a),y=mOf(b); return !!(x&&y&&x!==y); }
function hasBf(e){ return !!(e&&e.bf>0&&e.kg>0); }
function fatKg(e){ return e.kg*e.bf/100; }
function leanKg(e){ return e.kg-fatKg(e); }
function isMinor(){ return SNAP.age>0&&SNAP.age<18; }
// Which direction is "good" for body weight (same rule as trWeightDir).
function wDir(){
  if(SNAP.goal==='gain')return 'higher';
  if(SNAP.goal==='maintain')return null;
  const g=SNAP.goalWeight, f=SNAP.log.find(e=>e.kg>0);
  if(g>0&&f&&g>f.kg+0.5)return 'higher';
  return 'lower';
}

function model(){
  const log=SNAP.log, Lst=log[log.length-1];
  const W=log.filter(e=>e.kg>0);
  const wL=W[W.length-1]||null, wB=W.length>1?(CMP==='first'?W[0]:W[W.length-2]):null;
  const BF=log.filter(hasBf), Lbf=BF[BF.length-1]||null;
  // %BF baseline = previous (or first) entry measured with the SAME method as the latest one
  const same=Lbf?BF.filter(e=>e!==Lbf&&!mism(e,Lbf)):[];
  const bfB=same.length?(CMP==='first'?same[0]:same[same.length-1]):null;
  const bfOther=!!(Lbf&&!bfB&&BF.length>1);
  const dW=(wL&&wB)?+(wL.kg-wB.kg).toFixed(1):null;
  const dBf=bfB?+(Lbf.bf-bfB.bf).toFixed(1):null;
  const dFat=bfB?+(fatKg(Lbf)-fatKg(bfB)).toFixed(1):null;
  const dLean=bfB?+(leanKg(Lbf)-leanKg(bfB)).toFixed(1):null;
  const fatReliable=!!(bfB&&Lbf===Lst&&Math.abs(dBf)>=NOISE.bf);
  const bfF=Lbf?BF.find(e=>!mism(e,Lbf)):null;   // first same-method entry
  const startFat=(bfF&&bfF!==Lbf&&Math.abs(Lbf.bf-bfF.bf)>=NOISE.bf)?{d:+(fatKg(Lbf)-fatKg(bfF)).toFixed(1),date:bfF.date}:null;
  const startW=W.length>1?{d:+(wL.kg-W[0].kg).toFixed(1),date:W[0].date}:null;
  return {log,Lst,W,wL,wB,BF,Lbf,bfB,bfOther,dW,dBf,dFat,dLean,fatReliable,bfF,startFat,startW,dir:wDir()};
}

/* ── boot ─────────────────────────────────────────────────────────────── */
(async function boot(){
  if(!TOK){ return renderState('err','invalidTitle','invalidBody'); }
  try{
    sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{
      auth:{ persistSession:false, autoRefreshToken:false, detectSessionInUrl:false }
    });
  }catch(e){ return renderState('err','netTitle','netErr'); }
  let data,error;
  try{
    ({data,error}=await sb.rpc('get_lipo_snapshot',{p_token:TOK}));
  }catch(e){ return renderState('err','netTitle','netErr'); }
  if(error){ console.error('[metriseis] get_lipo_snapshot',error); return renderState('err','netTitle','netErr'); }
  if(!data || !data.snapshot){ return renderState('err','invalidTitle','invalidBody'); }
  start(data);
})();

/* ── delta chip: green when better, soft amber when worse, grey within measurement noise.
   Never red — this page is read by the client. ── */
function chip(d,noise,dir,unit){
  if(d==null||isNaN(d))return '';
  if(Math.abs(d)<noise)return '<span class="chip">'+(Math.abs(d)<0.05?esc(T('stable')):sgn(d)+unit)+'</span>';
  const good=dir==='lower'?d<0:dir==='higher'?d>0:null;
  return '<span class="chip'+(good===null?'':good?' good':' soft')+'">'+sgn(d)+unit+'</span>';
}

/* ── 2. hero ── */
function heroHtml(m){
  if(!m.wB&&!m.bfB){
    const v=m.wL?f1(m.wL.kg):(m.Lbf?m.Lbf.bf+'%':'—');
    return '<div class="card hero"><div class="hl">'+esc(T('firstLbl'))+' · '+esc(fmtDate(m.Lst.date))+'</div>'
      +'<div class="big">'+esc(v)+(m.wL?' <span>'+esc(T('kg'))+'</span>':'')+'</div>'
      +'<div class="plain">'+esc(T('sFirst'))+'</div></div>';
  }
  let big,unit,pos=false,date,txt;
  if(m.fatReliable||(m.dW==null&&m.bfB)){
    big=m.dFat; unit=T('kgFat'); date=m.bfB.date;
    if(!m.fatReliable){ txt=esc(CMP==='first'?T('sStableLong'):T('sStable')); }
    else if(m.dFat<0){
      pos=true;
      const dl=m.dLean;
      txt=T('sFatDown')(f1(-m.dFat))+(Math.abs(dl)<NOISE.mass?esc(T('sLeanSame')):dl>0?T('sLeanUp')(f1(dl)):esc(T('sLeanDown')(f1(-dl))));
    } else txt=esc(T('sFatUp'));
  } else {
    big=m.dW; unit=T('kg'); date=m.wB.date;
    const noise=Math.abs(m.dW)<NOISE.kg;
    const good=!noise&&(m.dir==='lower'?m.dW<0:m.dir==='higher'?m.dW>0:false);
    pos=good;
    txt=noise?esc(T('sWtStable')):(m.dW<0?T('sWtDown')(f1(-m.dW)):T('sWtUp')(f1(m.dW),good));
    if(m.bfB&&m.Lbf===m.Lst&&Math.abs(m.dBf)<NOISE.bf) txt+=' '+esc(CMP==='first'?T('sStableLong'):T('sStable'));
    else if(m.bfOther&&m.Lbf===m.Lst) txt+=' '+esc(T('sOther'));
  }
  let since='';
  if(CMP==='prev'){
    const s=(m.startFat&&m.startFat.date!==date)?{d:m.startFat.d,u:T('kgFat'),date:m.startFat.date,noise:0.05,good:m.startFat.d<0}
      :(m.startW&&m.startW.date!==date)?{d:m.startW.d,u:T('kg'),date:m.startW.date,noise:NOISE.kg,good:Math.abs(m.startW.d)>=NOISE.kg&&(m.dir==='lower'?m.startW.d<0:m.dir==='higher'?m.startW.d>0:false)}:null;
    if(s) since='<div class="since">'+esc(T('fromStart')(fmtDate(s.date)))+' <b'+(s.good?' class="g"':'')+'>'+(Math.abs(s.d)<s.noise?esc(T('stable')):sgn(s.d)+' '+esc(s.u))+'</b></div>';
  }
  return '<div class="card hero'+(pos?' pos':'')+'">'
    +'<div class="hl">'+esc(CMP==='first'?T('vsFirst'):T('vsPrev'))+' · '+esc(fmtDate(date))+'</div>'
    +'<div class="big">'+(Math.abs(big)<0.05?'±0.0':sgn(big))+' <span>'+esc(unit)+'</span></div>'
    +'<div class="plain"><b>'+esc(T('plainLbl'))+'</b> '+txt+'</div>'+since+'</div>';
}

/* ── 3. three tiles ── */
function tilesHtml(m){
  const t=function(lbl,val,u,ch,title,extra){
    return '<div class="tile"'+(title?' title="'+esc(title)+'"':'')+'><div class="tl">'+esc(lbl)+'</div><div class="tv"><b>'+val+(val!=='—'?' <span>'+u+'</span>':'')+'</b>'+(extra||'')+'</div>'+ch+'</div>';
  };
  const other='<span class="chip">'+esc(T('otherM'))+'</span>';
  return '<div class="tiles">'
    +t(T('tWeight'),m.wL?f1(m.wL.kg):'—',esc(T('kg')),m.wB?chip(m.dW,NOISE.kg,m.dir,''):'')
    // fat in kg with the % in brackets (Stephanos' choice); the chip stays grey while Δ%BF is
    // within caliper noise — same reliability rule as the hero
    +t(T('tBf'),m.Lbf?f1(fatKg(m.Lbf)):'—',esc(T('kg')),m.bfB?chip(m.dFat,Math.abs(m.dBf)<NOISE.bf?Infinity:NOISE.mass,'lower',''):(m.bfOther?other:''),'',m.Lbf?' <span class="pc">('+f1(m.Lbf.bf)+'%)</span>':'')
    +t(T('tMuscle'),m.Lbf?f1(leanKg(m.Lbf)):'—',esc(T('kg')),m.bfB?chip(m.dLean,NOISE.mass,'higher',''):(m.bfOther?other:''),T('muscleHint'))
    +'</div>';
}

/* ── 4. goal bar ── */
function goalHtml(m){
  const g=SNAP.goalWeight;
  if(!(g>0)||!m.wL)return '';
  const s=m.W[0].kg,n=m.wL.kg;
  if(Math.abs(s-g)<0.3)return '';
  const pct=Math.max(0,Math.min(100,Math.round((s-n)/(s-g)*100)));
  const done=Math.abs(n-g)<0.3||pct>=100;
  return '<div class="card"><h2>'+esc(T('goalTitle'))+'</h2>'
    +'<div class="gbar" role="img" aria-label="'+pct+'%"><i style="width:'+pct+'%"></i></div>'
    +'<div class="glbl"><span>'+esc(T('gStart'))+' '+f1(s)+'</span><b>'+esc(T('gNow'))+' '+f1(n)+' · '+pct+'%</b><span>'+esc(T('gGoal'))+' '+f1(g)+'</span></div>'
    +'<div class="gtxt">'+(done?esc(T('gDone')):T('gLeft')(f1(Math.abs(g-n))))+'</div></div>';
}

/* ── 5. milestones (port of trMilestones, no circumferences) ── */
function milestones(m){
  const out=[]; let next=null;
  if(m.W.length>=1&&m.wL){
    const dW=+(m.wL.kg-m.W[0].kg).toFixed(1);
    if(m.dir==='lower'&&!isMinor()){
      let got=null;
      [2,3,5,8,10,15,20,25,30].forEach(s=>{ if(-dW>=s)got=s; else if(!next&&-dW>0)next=T('msNext')(s,f1(s+dW)); });
      if(got)out.push(T('msKg')(got));
    }
  }
  if(m.Lbf&&m.bfF&&m.bfF!==m.Lbf){
    const a=m.bfF,b=m.Lbf,dF=fatKg(b)-fatKg(a),dL=leanKg(b)-leanKg(a);
    [10,5,3,2].some(s=>{ if(-dF>=s){out.push(T('msFat')(s));return true;} return false; });
    if(m.dir==='higher')[3,2,1].some(s=>{ if(dL>=s){out.push(T('msLean')(s));return true;} return false; });
    const r=bfGalRow(SNAP.sex,SNAP.age);
    if(r&&!isMinor()&&a.bf>r.h[1]&&b.bf<=r.h[1])out.push(T('msHealthy'));
  }
  const g=SNAP.goalWeight;
  if(g>0&&m.wL&&Math.abs(m.W[0].kg-g)>=0.3){
    const pct=(m.W[0].kg-m.wL.kg)/(m.W[0].kg-g)*100;
    if(pct>=100)out.push(T('msGoal')); else if(pct>=50)out.push(T('msHalf'));
  }
  [20,10,5].some(s=>{ if(m.log.length>=s){out.push(T('msVisits')(s));return true;} return false; });
  return {got:out,next:next};
}
function milestonesHtml(m){
  const ms=milestones(m);
  if(!ms.got.length&&!ms.next)return '';
  return '<div class="card"><h2>'+esc(T('msTitle'))+'</h2><div class="ms">'
    +ms.got.map(t=>'<span>'+esc(t)+'</span>').join('')
    +(ms.next?'<span class="lk">🔒 '+esc(ms.next)+'</span>':'')+'</div></div>';
}

/* ── 6. «Τι κάνουμε τώρα» — the old buildSuggestion, noise- and method-aware. Only what the
   measurements themselves say — no protein/diet advice (Stephanos' choice). ── */
function suggestion(m){
  if(!m.Lbf) return T('noBF');
  const parts=[];
  if(m.bfB){
    if(m.dBf<=-NOISE.bf){
      parts.push(T('sugGoodDrop')(f1(-m.dBf)));
      const wk=Math.max(1,(new Date(m.Lbf.date)-new Date(m.bfB.date))/86400000/7);
      parts.push((-m.dBf/wk)>0.6?T('sugAggr'):T('sugHealthy'));
    }
    else if(m.dBf>=NOISE.bf) parts.push(T('sugRise'));
    else parts.push(T('sugStable'));
  }
  const r=bfGalRow(SNAP.sex,SNAP.age>0?SNAP.age:30);
  const goal=SNAP.goalBF||(r?r.h[1]:null);
  if(goal){
    if(m.Lbf.bf>goal) parts.push(T('sugToGo')(f1(m.Lbf.kg*(m.Lbf.bf-goal)/100)));
    else parts.push(T('sugAtGoal'));
  }
  return parts.join(' ');
}

/* ── details: «Πού βρίσκεσαι» zone bar (port of trZoneBarHtml; soft colours, no red) ── */
function zoneHtml(m){
  if(!m.Lbf||isMinor())return '';
  const sex=SNAP.sex==='F'?'F':'M', hasAge=SNAP.age>0;
  const r=bfGalRow(sex,hasAge?SNAP.age:30);
  const lo=Math.max(2,r.h[0]-8),hi=r.o+8;
  const X=function(v){return Math.max(0,Math.min(100,(v-lo)/(hi-lo)*100));};
  const segs=[[lo,r.h[0],'var(--z-low)',T('zLow')],[r.h[0],r.h[1],'var(--z-ok)',T('zHealthy')],[r.h[1],r.o,'var(--z-up)',T('zUp')],[r.o,hi,'var(--z-hi)',T('zHigh')]];
  let bar=segs.map(s=>{
    const l=X(s[0]).toFixed(1),w=(X(s[1])-X(s[0])).toFixed(1);
    return '<div class="sg" style="left:'+l+'%;width:'+w+'%;background:'+s[2]+'"></div><div class="sl" style="left:'+l+'%;width:'+w+'%">'+esc(s[3])+'</div>';
  }).join('');
  const v=m.Lbf.bf;
  const base=m.bfB?'<div class="base" style="left:'+X(m.bfB.bf).toFixed(1)+'%"></div>':'';
  const goal=SNAP.goalBF>0?'<div class="goal" style="left:'+X(SNAP.goalBF).toFixed(1)+'%"></div>':'';
  bar+=base+goal+'<div class="cur" style="left:'+X(v).toFixed(1)+'%"></div><div class="curl" style="left:'+Math.max(8,Math.min(92,X(v))).toFixed(1)+'%">'+esc(T('zYou'))+' '+f1(v)+'%</div>';
  const notes=[T('zRange')(r.h[0],r.h[1])];
  if(base)notes.push(T('zDash')(CMP==='first'?T('cmpFirst'):T('cmpPrev'),f1(m.bfB.bf)));
  if(goal)notes.push(T('zGoal')(SNAP.goalBF));
  notes.push(T('zSrc'));
  return '<div class="card"><h2>'+esc(T('zoneTitle'))+' <span class="s">· '+esc(T('zoneSub')(sex==='F',hasAge?r.aLo+'–'+r.aHi:''))+'</span></h2>'
    +'<div class="zone">'+bar+'</div><div class="note">'+esc(notes.join(' · '))+'</div></div>';
}

/* ── details: skinfold map (port of trSkinfoldMapHtml) ── */
const SF_POS={chest:[36,46],subscapular:[54,44],midaxillary:[62,62],tricep:[76,58],abdomen:[40,82],suprailiac:[58,94],thigh:[34,142],calf:[56,174]};
function bodySvg(extra){

}
function skinfoldHtml(){
  const sf=SNAP.log.filter(e=>e.sfFields&&Object.keys(e.sfFields).some(k=>e.sfFields[k]>0));
  if(sf.length<2)return '';
  const Le=sf[sf.length-1],Be=CMP==='first'?sf[0]:sf[sf.length-2],a=Be.sfFields,b=Le.sfFields;
  const keys=Object.keys(SF_POS).filter(k=>a[k]>0&&b[k]>0);
  if(!keys.length)return '';
  const colOf=p=>p<=-15?'var(--sf-good2)':p<=-5?'var(--sf-good1)':p<5?'var(--sf-flat)':'var(--sf-up)';
  const SFL=T('SF');
  let dots='',rows='';
  keys.forEach(k=>{
    const p=Math.round((b[k]-a[k])/a[k]*100),pos=SF_POS[k];
    dots+='<circle cx="'+pos[0]+'" cy="'+pos[1]+'" r="6" fill="'+colOf(p)+'" stroke="var(--card)" stroke-width="1.5"/>';
    rows+='<div class="sfrow"><span><i class="dot" style="background:'+colOf(p)+'"></i>'+esc(SFL[k]||k)+' <small>'+a[k]+'→'+b[k]+' mm</small></span>'
      +'<span class="chip'+(p<=-5?' good':p<5?'':' soft')+'">'+sgn(p,0)+'%</span></div>';
  });
  return '<div class="card"><h2>'+esc(T('sfTitle'))+' <span class="s">· '+esc(fmtDate(Be.date,true))+' → '+esc(fmtDate(Le.date,true))+'</span></h2>'
    +'<div class="sfwrap">'+bodySvg(dots)+'<div style="flex:1;min-width:0">'+rows+'</div></div>'
    +'<div class="note">'+esc(T('sfNote'))+'</div></div>';
}

/* ── details: fat kg per visit (same method as the latest %BF only) ── */
function fatBarsHtml(m){
  if(!m.Lbf)return '';
  const e8=m.BF.filter(e=>!mism(e,m.Lbf)).slice(-8);
  if(e8.length<2)return '';
  const mx=Math.max.apply(null,e8.map(fatKg));
  return '<div class="card"><h2>'+esc(T('fbTitle'))+'</h2>'
    +e8.map(e=>{ const f=fatKg(e);
      return '<div class="fb"><span class="d">'+esc(fmtDate(e.date,true))+'</span><span class="t"><i style="width:'+(f/mx*100).toFixed(1)+'%"></i></span><span class="v">'+f1(f)+' '+esc(T('kg'))+'</span></div>';
    }).join('')+'</div>';
}

/* ── details: history list (newest first) ── */
function methodLbl(e){
  const k=mOf(e);
  return k==='caliper'?T('mCaliper'):k==='bia'?'BIA':k==='dexa'?'DEXA':k==='estimate'?T('mEst'):'';
}
function historyHtml(m){
  if(m.log.length<2)return '';
  const rows=m.log.slice(-12).reverse().map(e=>{
    // method named only on rows that differ from the latest %BF method — no repeated noise
    const other=e.bf>0&&m.Lbf&&mism(e,m.Lbf);
    const bf=e.bf>0?f1(e.bf)+'% '+esc(T('hFat')):'';
    return '<div class="hr"><span class="d">'+esc(fmtDate(e.date))+'</span><span class="v">'
      +(e.kg>0?'<b>'+f1(e.kg)+' '+esc(T('kg'))+'</b>':'')+(e.kg>0&&bf?' · ':'')+bf
      +(other?'<span class="o">'+esc(methodLbl(e))+' · '+esc(T('hOther'))+'</span>':'')+'</span></div>';
  }).join('');
  return '<div class="card"><h2>'+esc(T('hTitle'))+'</h2>'+rows+'</div>';
}

function render(){
  const m=model();
  const fname=(SNAP.name||'').split(' ')[0]||'';
  let h='<div class="who"><h1>'+esc(T('greet')(fname))+'</h1>'
    +(SNAP.profileOnly?'':'<div class="upd">'+esc(T('lastM')(fmtDate(m.Lst.date)))+'</div>')
    +(SNAP.profileOnly?'<span class="flag">'+esc(T('profileFlag'))+'</span>':'')+'</div>';
  h+=heroHtml(m);
  h+=tilesHtml(m);
  h+=goalHtml(m);
  h+=milestonesHtml(m);
  h+='<div class="card next"><h2>'+esc(T('nextTitle'))+'</h2><p>'+esc(suggestion(m))+'</p></div>';

  const det=[cmpHtml(m),zoneHtml(m),skinfoldHtml(),fatBarsHtml(m),historyHtml(m)].filter(Boolean);
  if(det.length){
    h+='<button type="button" class="morebtn noprint" aria-expanded="'+DET+'" onclick="toggleDet()">'+esc(DET?T('less'):T('more'))+'</button>';
    h+='<div class="det'+(DET?' open':'')+'">'+det.join('')+'</div>';
  }
  h+='<div class="scrfoot">Feed Your Health · '+esc(T('footQ'))+'<br>🔒 '+esc(T('lock'))
    +'<br><button type="button" class="noprint" onclick="window.print()">'+esc(T('print'))+'</button></div>';
  el('root').innerHTML=h;
}
</script>
</body>
