  const rows=GALLAGHER_BF[sex==='F'?'F':'M'];
  const a=age<20?20:(age>79?79:age);
  return rows.find(r=>a>=r.aLo&&a<=r.aHi)||rows[rows.length-1];
}
function bfHealthByAge(bf,sex,age){
  const row=bfGalRow(sex,age);
  if(!(bf>0)||!row)return null;
  let key; if(bf<row.h[0])key='low'; else if(bf<=row.h[1])key='healthy'; else if(bf<row.o)key='overfat'; else key='obese';
  const col={low:'#1565C0',healthy:'var(--ok)',overfat:'#f57c00',obese:'#c62828'}[key];
  return {key,col,healthy:row.h.slice(),obeseLo:row.o,ageBand:row.aLo+'–'+row.aHi};
}

/* ── range-bar helpers — same logic as exportLipometriaPDF() / plan.html's rangeBar ── */
function rbPct(v,min,max){return Math.max(0,Math.min(100,(v-min)/(max-min)*100));}
function rbGradient(boundaries,max){
  const stops=[];
  boundaries.forEach((b,i)=>{
    const startPct=rbPct(b.v,boundaries[0].v,max);
    stops.push(b.col+' '+startPct.toFixed(0)+'%');
    if(i<boundaries.length-1){const endPct=rbPct(boundaries[i+1].v,boundaries[0].v,max);stops.push(b.col+' '+endPct.toFixed(0)+'%');}
  });
  return 'linear-gradient(90deg,'+stops.join(',')+')';
}
function rangeBar(label,valTxt,valCol,catTxt,boundaries,max,curVal,goalVal){
  if(!boundaries){
    return '<div class="rb"><div class="rbt"><span>'+label+'</span><b style="color:'+valCol+'">'+valTxt+'</b></div></div>';
  }
  const curPct=curVal!=null?rbPct(curVal,boundaries[0].v,max):null;
  const goalPct=goalVal!=null?rbPct(goalVal,boundaries[0].v,max):null;
  return '<div class="rb"><div class="rbt"><span>'+label+'</span><b style="color:'+valCol+'">'+valTxt+(catTxt?' · '+catTxt:'')+'</b></div>'
    +'<div class="rbtrack" style="background:'+rbGradient(boundaries,max)+'">'
    +(curPct!=null?'<span class="rbcur" style="left:'+curPct.toFixed(1)+'%"></span>':'')
    +(goalPct!=null?'<span class="rbgoal" style="left:'+goalPct.toFixed(1)+'%"></span>':'')
    +'</div></div>';
}
function deltaSpan(delta,decimals,goodDir){
  if(delta==null||isNaN(delta))return '';
  const eps=decimals===0?0.5:(decimals===2?0.005:0.05);
  const flat=Math.abs(delta)<eps;
  const improving=goodDir==='down'?delta<0:delta>0;
  const cls=flat?'fl':(improving?'dn':'up');
  const arrow=flat?'—':(delta>0?'▲':'▼');
  return ' <span class="'+cls+'">'+arrow+Math.abs(delta).toFixed(decimals)+'</span>';
}
function sparkline(vals,color){
  const v=vals.filter(x=>x!=null);
  if(v.length<2)return '';
  const min=Math.min(...v),max=Math.max(...v),range=(max-min)||1,n=v.length;
  const pts=v.map((x,i)=>(2+i/(n-1)*94).toFixed(1)+','+(4+(1-(x-min)/range)*24).toFixed(1)).join(' ');
  const last=pts.split(' ').pop().split(',');
  return '<svg viewBox="0 0 100 34" preserveAspectRatio="none" aria-hidden="true">'
    +'<polygon points="'+pts+' '+last[0]+',34 2,34" fill="'+color+'22"/>'
    +'<polyline points="'+pts+'" fill="none" stroke="'+color+'" stroke-width="2.2"/>'
    +'<circle cx="'+last[0]+'" cy="'+last[1]+'" r="2.6" fill="'+color+'"/></svg>';
}
function sfSumOf(entry){
  if(!entry||!entry.sfFields)return null;
  const v=Object.keys(entry.sfFields).map(k=>entry.sfFields[k]);
  return v.length?v.reduce((s,x)=>s+x,0):null;
}
function fmtDate(iso){
  if(!iso)return '';
  const d=new Date(iso); if(isNaN(d))return '';
  const MON=L==='en'?['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']
                     :['Ιαν','Φεβ','Μαρ','Απρ','Μαϊ','Ιουν','Ιουλ','Αυγ','Σεπ','Οκτ','Νοε','Δεκ'];
  return L==='en' ? (MON[d.getMonth()]+' '+d.getDate()+', '+d.getFullYear()) : (d.getDate()+' '+MON[d.getMonth()]+' '+d.getFullYear());
}

/* ── boot ─────────────────────────────────────────────────────────────── */
(async function boot(){
  if(!TOK){ return renderState('err','invalidTitle','invalidBody'); }
  try{
    sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{
      auth:{ persistSession:false, autoRefreshToken:false, detectSessionInUrl:false }
    });
  }catch(e){ return renderState('err','netTitle','netErr'); }
  let data,error;
  try{
    ({data,error}=await sb.rpc('get_lipo_snapshot',{p_token:TOK}));
  }catch(e){ return renderState('err','netTitle','netErr'); }
  if(error){ console.error('[metriseis] get_lipo_snapshot',error); return renderState('err','netTitle','netErr'); }
  if(!data || !data.snapshot){ return renderState('err','invalidTitle','invalidBody'); }
  WRAP=data; SNAP=data.snapshot;
  L=(data.lang==='en')?'en':'el';
  const lb=el('langbar'); if(lb) lb.hidden=false; syncLangBar();
  if(!SNAP.log || !SNAP.log.length){ return renderState('ok','needMoreTitle','needMoreBody'); }
  render();
})();

function setLang(l){ L=l; syncLangBar(); render(); }
function syncLangBar(){
  document.querySelectorAll('#langbar button').forEach(b=>b.setAttribute('aria-pressed', String(b.dataset.l===L)));
}

function renderState(kind,titleKey,bodyKey){
  const r=el('root'); if(!r)return;
  const icon=kind==='err'?'✕':(kind==='ok'?'⏳':'✓');
  r.innerHTML='<div class="state"><div class="big'+(kind==='err'?' err':'')+'">'+icon+'</div>'
    +'<h1>'+esc(T(titleKey))+'</h1><p>'+esc(T(bodyKey))+'</p></div>';
}

/* ── compute everything for the chosen baseline (client-side — the full history already
   sits in SNAP.log, so switching "Compare with" needs no server round-trip) ── */
function computeView(){
  const log=SNAP.log;
  const entry=log[log.length-1];
  let baseline=null;
  if(log.length>1){
    if(BASELINE==='prev') baseline=log[log.length-2];
    else if(BASELINE==='plan' && SNAP.planGeneratedAt){
      const planDay=new Date(SNAP.planGeneratedAt).toISOString().slice(0,10);
      let best=null; log.forEach(e=>{ if(e!==entry && e.date<=planDay) best=e; });
      baseline=best||log[0];
    } else baseline=log[0];
  }
  const weight=entry.kg, bf=entry.bf;
  const lbm=(bf&&weight)?+(weight*(1-bf/100)).toFixed(1):null;
  const fm=(bf&&weight)?+(weight*bf/100).toFixed(1):null;
  const h=SNAP.height||0, age=SNAP.age, sex=SNAP.sex||'M', isFem=sex==='F';
  const isMinor=(age!=null&&age>0&&age<18);
  const bmi=(h>0&&weight)?+(weight/((h/100)*(h/100))).toFixed(1):null;
  const bmiCat=(bmi!=null&&!isMinor)?(bmi<18.5?T('bmiUnder'):bmi<25?T('bmiNorm'):bmi<30?T('bmiOver'):bmi<35?T('bmiObese1'):bmi<40?T('bmiObese2'):T('bmiObese3')):null;
  const bmiCol=(bmi!=null&&!isMinor)?(bmi<18.5?'#1565C0':bmi<25?'var(--ok)':bmi<30?'#f57c00':'#c62828'):'var(--faint)';
  const ffmi=(lbm&&h>0)?+(lbm/((h/100)*(h/100))).toFixed(1):null;
  const ffLo=isFem?15:18, ffMid=isFem?18:20, ffHi=isFem?21:23;
  const ffmiCat=(ffmi&&!isMinor)?(ffmi<ffLo?T('ffLow'):ffmi<ffMid?T('ffNorm'):ffmi<ffHi?T('ffAbove'):T('ffHigh')):null;
  const ffmiCol=(ffmi&&!isMinor)?(ffmi<ffLo?'#1565C0':ffmi<ffHi?'var(--ok)':'#f57c00'):'var(--faint)';

  const bfBandsNow=bfBands(sex);
  const bfGv=bf?bfHealthByAge(bf,sex,age):null;
  let bfCat=null,bfCol='var(--faint)',bfBounds=null;
  const GLN={low:T('below'),healthy:T('healthy'),overfat:T('overfat'),obese:T('obese')};
  if(bfGv){
    bfCat=GLN[bfGv.key]+' ('+bfGv.ageBand+')'; bfCol=bfGv.col;
    bfBounds=[{v:isFem?5:0,col:'#1565C0'},{v:bfGv.healthy[0],col:'var(--ok)'},{v:bfGv.healthy[1]+1,col:'#f57c00'},{v:bfGv.obeseLo,col:'#c62828'}];
  } else if(bf){
    const lbl=[T('essential'),T('athletic'),T('fit'),T('acceptable'),T('obese')];
    bfBandsNow.forEach((b,i)=>{ if(bf>=b.lo){bfCat=lbl[i];bfCol=b.col;} });
    bfBounds=[{v:isFem?5:0,col:bfBandsNow[0].col},{v:bfBandsNow[1].lo,col:bfBandsNow[1].col},{v:bfBandsNow[2].lo,col:bfBandsNow[2].col},{v:bfBandsNow[3].lo,col:bfBandsNow[3].col},{v:bfBandsNow[4].lo,col:bfBandsNow[4].col}];
  }
  const bfGoal=SNAP.goalBF||(bfGv?bfGv.healthy[1]:(bfBandsNow[2]&&bfBandsNow[2].hi));
  const bfMax=bfGv?bfGv.obeseLo+8:(isFem?45:35);

  const METHOD_INFO={
    caliper:{l:(L==='en'?'skinfolds':'δερματοπτυχές')+(entry.sfProtocol?' · '+({jp4:'JP4',jp3:'JP3',jp7:'JP7',slaughter:'Slaughter'}[entry.sfProtocol]||entry.sfProtocol):''),e:'±3–5%'},
    bia:{l:'BIA',e:'±3–5%'},
    dexa:{l:'DEXA',e:'±1–2%'},
    estimate:{l:(L==='en'?'estimate':'εκτίμηση'),e:'±5–8%'}
  };
  const bfm=entry.bfMethod||(entry.sfProtocol?'caliper':'');
  const methodInfo=METHOD_INFO[bfm]||null;
  const bfMethodLbl=methodInfo?(methodInfo.l+' · '+methodInfo.e):'';

  const wDelta=(baseline&&baseline.kg!=null&&weight!=null)?+(weight-baseline.kg).toFixed(1):null;
  const prevBf=(baseline&&baseline.bf>0)?baseline.bf:null;
  const bfDelta=(bf&&prevBf)?+(bf-prevBf).toFixed(1):null;
  const prevLbm=(baseline&&prevBf&&baseline.kg)?+(baseline.kg*(1-prevBf/100)).toFixed(1):null;
  const lbmDelta=(lbm&&prevLbm)?+(lbm-prevLbm).toFixed(1):null;

  const spanDays=(baseline&&baseline.date&&entry.date)?Math.max(1,Math.round((new Date(entry.date)-new Date(baseline.date))/86400000)):null;
  const spanWk=spanDays?+(spanDays/7).toFixed(1):null;
  const bfRateWk=(bfDelta!=null&&spanWk)?+(bfDelta/spanWk).toFixed(2):null;
  const wtRateWk=(wDelta!=null&&spanWk&&baseline&&baseline.kg)?+((wDelta/baseline.kg*100)/spanWk).toFixed(2):null;
  function rz(v,lo,hi){const a=Math.abs(v||0);return a<lo?0:a<=hi?1:2;}
  const bfRateZone=bfRateWk!=null?rz(bfRateWk,0.1,0.6):null;
  const wtRateZone=wtRateWk!=null?rz(wtRateWk,0.25,1.0):null;
  const rateOK=(bfRateZone==null||bfRateZone<2)&&(wtRateZone==null||wtRateZone<2);

  const wLost=(wDelta!=null&&wDelta<0)?+(-wDelta).toFixed(1):null;
  const lbmLost=(lbmDelta!=null)?+Math.max(0,-lbmDelta).toFixed(1):null;
  const leanSharePct=(wLost&&lbmLost!=null&&wLost>0)?Math.round(lbmLost/wLost*100):null;
  const leanOK=(leanSharePct==null)||leanSharePct<=30;

  const sSum=sfSumOf(entry), prevSum=baseline?sfSumOf(baseline):null;
  const sSumDelta=(sSum!=null&&prevSum!=null)?Math.round(sSum-prevSum):null;

  return {entry,baseline,weight,bf,lbm,fm,h,age,sex,isFem,isMinor,bmi,bmiCat,bmiCol,ffmi,ffLo,ffMid,ffHi,ffmiCat,ffmiCol,
    bfCat,bfCol,bfBounds,bfGoal,bfMax,bfMethodLbl,wDelta,bfDelta,lbmDelta,spanWk,bfRateWk,wtRateWk,bfRateZone,wtRateZone,rateOK,
    wLost,lbmLost,leanSharePct,leanOK,sSum,sSumDelta};
}

function buildSuggestion(v){
  if(!v.bf) return T('noBF');
  const parts=[];
  if(v.bfDelta!=null){
    if(v.bfDelta<0) parts.push(T('sugGoodDrop')(Math.abs(v.bfDelta).toFixed(1)));
    else if(v.bfDelta>0) parts.push(T('sugRise')(v.bfDelta.toFixed(1)));
    else parts.push(T('sugStable'));
  }
  if(v.bfRateWk!=null && v.bfRateWk<0){
    if(v.bfRateZone===2) parts.push(T('sugAggr'));
    else if(v.bfRateZone===0) parts.push(T('sugStall'));
    else parts.push(T('sugHealthy'));
  }
  if(v.bf>v.bfGoal){
    const fmGoalKg=+(v.weight*(v.bf-v.bfGoal)/100).toFixed(1);
    parts.push(T('sugToGo')(fmGoalKg));
  } else {
    parts.push(T('sugAtGoal'));
  }
  if(SNAP.planProtG){
    const perKg=+(SNAP.planProtG/v.weight).toFixed(1);
    parts.push(T('sugProtPlan')(SNAP.planProtG,perKg));
  } else {
    parts.push(T('sugProtGen'));
  }
  return parts.join(' ');
}

function render(){
  const v=computeView();
  const log=SNAP.log, hist=log.slice(-8);
  const fname=(SNAP.name||'').split(' ')[0]||'';

  let h='';
  h+='<div class="who"><h1>'+esc(T('greet')(fname))+'</h1>'
    +'<div class="upd"><span class="pulse"></span>'+esc(T('updated')(fmtDate(WRAP.updated_at)))+' · '+esc(T('auto'))+'</div></div>';

  if(SNAP.profileOnly){
    h+='<div style="margin:6px 4px"><span class="flag">'+esc(T('profileFlag'))+'</span></div>';
  }

  h+='<div class="ctrls noprint">';
  if(log.length>1){
    h+='<label>'+esc(T('compareLbl'))+' <select id="baselineSel" onchange="BASELINE=this.value;render()">'
      +'<option value="first"'+(BASELINE==='first'?' selected':'')+'>'+esc(T('cmpFirst'))+'</option>'
      +'<option value="prev"'+(BASELINE==='prev'?' selected':'')+'>'+esc(T('cmpPrev'))+'</option>'
      +(SNAP.planGeneratedAt?'<option value="plan"'+(BASELINE==='plan'?' selected':'')+'>'+esc(T('cmpPlan'))+'</option>':'')
      +'</select></label>';
  }
  h+='<button type="button" class="pdfbtn" onclick="window.print()">'+esc(T('pdf'))+'</button></div>';
  if(log.length>1 && v.baseline){
    h+='<div class="printonly" style="font-size:.78rem;color:var(--faint);margin:4px 4px 0">'+esc(T('compareLbl'))+' '
      +esc(BASELINE==='prev'?T('cmpPrev'):BASELINE==='plan'?T('cmpPlan'):T('cmpFirst'))+' ('+esc(fmtDate(v.baseline.date))+')</div>';
  }

  // donut + where-you-stand
  h+='<div class="row2">';
  h+='<div class="card donut"><h2>'+esc(T('compTitle'))+'</h2>';
  if(v.weight&&v.lbm!=null&&v.fm!=null){
    const lbmFrac=v.lbm/v.weight, fatFrac=v.fm/v.weight;
    h+='<svg viewBox="0 0 140 140" width="118" height="118" style="margin:2px auto 0;display:block" role="img" aria-label="'+v.weight+' kg">'
      +'<circle cx="70" cy="70" r="52" fill="none" stroke="var(--bord-l)" stroke-width="16"/>'
      +'<circle cx="70" cy="70" r="52" fill="none" stroke="#1565C0" stroke-width="16" stroke-dasharray="'+(326.7*lbmFrac).toFixed(1)+' 326.7" transform="rotate(-90 70 70)"/>'
      +'<circle cx="70" cy="70" r="52" fill="none" stroke="#e65100" stroke-width="16" stroke-dasharray="'+(326.7*fatFrac).toFixed(1)+' 326.7" stroke-dashoffset="-'+(326.7*lbmFrac).toFixed(1)+'" transform="rotate(-90 70 70)"/>'
      +'<text x="70" y="66" text-anchor="middle" font-size="19" font-weight="800" fill="var(--teal-d)">'+v.weight+'</text>'
      +'<text x="70" y="80" text-anchor="middle" font-size="7" fill="var(--faint)">'+esc(T('compTotal'))+'</text>'
      +(v.wDelta!=null?'<text x="70" y="93" text-anchor="middle" font-size="7.5" font-weight="800" fill="'+(v.wDelta<0?'var(--ok)':v.wDelta>0?'#c62828':'var(--faint)')+'">'+(v.wDelta<0?'▼':v.wDelta>0?'▲':'—')+' '+Math.abs(v.wDelta).toFixed(1)+'kg</text>':'')
      +'</svg><div class="dlgd"><span><i style="background:#1565C0"></i>'+esc(T('lean'))+' '+v.lbm+'kg</span><span><i style="background:#e65100"></i>'+esc(T('fat'))+' '+v.fm+'kg</span></div>';
  } else {
    h+='<div style="padding:30px 0;color:var(--faint);font-size:.85rem">—</div>';
  }
  h+='</div>';

  h+='<div class="card"><h2>'+esc(T('whereTitle'))+' <span class="s">· '+esc(T('goalLegend'))+'</span></h2>';
  if(v.bmi!=null) h+=rangeBar(T('bmi'),String(v.bmi),v.bmiCol,v.isMinor?null:v.bmiCat,v.isMinor?null:[{v:15,col:'#1565C0'},{v:18.5,col:'var(--ok)'},{v:25,col:'#f57c00'},{v:30,col:'#c62828'}],40,v.bmi,24.9);
  if(v.ffmi!=null) h+=rangeBar(T('ffmi'),String(v.ffmi),v.ffmiCol,v.isMinor?null:v.ffmiCat,v.isMinor?null:[{v:v.ffLo-4,col:'#1565C0'},{v:v.ffLo,col:'var(--ok)'},{v:v.ffMid,col:'#43a047'},{v:v.ffHi,col:'#f57c00'}],v.ffHi+5,v.ffmi,null);
  if(v.bf) h+=rangeBar(T('bfPct'),v.bf+'%'+deltaSpan(v.bfDelta,1,'down'),v.bfCol,v.bfCat,v.bfBounds,v.bfMax,v.bf,v.bfGoal);
  if(v.bfMethodLbl) h+='<div class="method">'+esc(T('method'))+': '+esc(v.bfMethodLbl)+'</div>';
  if(v.ffmi!=null) h+='<div class="glo">'+esc(T('ffmiGlo'))+'</div>';
  h+='</div></div>';

  // rate of change
  if(v.spanWk && (v.bfRateWk!=null||v.wtRateWk!=null)){
    h+='<div class="card"><h2>'+esc(T('rateTitle'))+' <span class="s">'+esc(T('rateSpan')(v.spanWk))+'</span></h2>'
      +'<div class="rateg">';
    function rateCell(label,val,unit,zone){
      const mk=zone===0?14:zone===1?50:86;
      return '<div><div class="rc-l">'+esc(label)+'</div><div class="rc-b">'+(val>0?'+':'')+val+' <span>'+esc(unit)+'</span></div>'
        +'<div class="zone"><span class="l a">'+esc(T('stalled'))+'</span><span class="l b">'+esc(T('aggressive'))+'</span><span class="mk" style="left:'+mk+'%"></span></div></div>';
    }
    if(v.bfRateWk!=null) h+=rateCell(T('rateBf'),v.bfRateWk,T('ptsWk'),v.bfRateZone);
    if(v.wtRateWk!=null) h+=rateCell(T('rateWt'),v.wtRateWk,T('pctWk'),v.wtRateZone);
    h+='</div><div class="verdict'+(v.rateOK?'':' warn')+'">'+esc(v.rateOK?T('rateOK'):T('rateWarn'))+'</div></div>';
  }

  // lean-mass retention
  if(v.leanSharePct!=null){
    h+='<div class="card"><h2>'+esc(T('leanTitle'))+'</h2><div class="leanrow">'
      +'<div class="leanbar" role="img" aria-label="lean vs fat share of weight lost"><i class="f" style="flex:'+Math.max(0,100-v.leanSharePct)+'"></i><i class="l" style="flex:'+v.leanSharePct+'"></i></div>'
      +'<div><div class="leantxt">'+T('leanTxt')(v.wLost.toFixed(1),(v.wLost-v.lbmLost).toFixed(1),v.lbmLost.toFixed(1),v.leanSharePct)+'</div>'
      +'<div class="leanflag'+(v.leanOK?'':' warn')+'">'+esc(v.leanOK?T('leanOK'):T('leanWarn'))+'</div></div>'
      +'</div></div>';
  }

  // suggestion
  h+='<div class="card sugg"><h2>'+esc(T('suggTitle'))+'</h2><p>'+esc(buildSuggestion(v))+'</p></div>';

  // history
  if(hist.length>1){
    const hw=hist.map(e=>e.kg), hb=hist.map(e=>e.bf>0?e.bf:null);
    const hl=hist.map(e=>e.bf>0?+(e.kg*(1-e.bf/100)).toFixed(1):null);
    const hs=hist.map(e=>sfSumOf(e));
    const anySf=hs.some(x=>x!=null);
    h+='<div class="card"><h2>'+esc(T('histTitle'))+' <span class="s">'+esc(T('histSpan')(hist.length))+'</span></h2><div class="sparks">'
      +'<div class="spark">'+sparkline(hw,'#1565C0')+'<div class="sl">'+esc(T('weight'))+'</div><div class="sv" style="color:#1565C0">'+v.weight+' kg'+deltaSpan(v.wDelta,1,'down')+'</div></div>'
      +'<div class="spark">'+sparkline(hb,'#c62828')+'<div class="sl">'+esc(T('bfPctLbl'))+'</div><div class="sv" style="color:#c62828">'+(v.bf?v.bf+'%':'—')+deltaSpan(v.bfDelta,1,'down')+'</div></div>'
      +'<div class="spark">'+sparkline(hl,'var(--ok)')+'<div class="sl">'+esc(T('leanMass'))+'</div><div class="sv" style="color:var(--ok)">'+(v.lbm||'—')+' kg'+deltaSpan(v.lbmDelta,1,'up')+'</div></div>'
      +(anySf?'<div class="spark">'+sparkline(hs,'#8a5a00')+'<div class="sl">'+esc(T('sfSum'))+'</div><div class="sv" style="color:#8a5a00">'+(v.sSum!=null?Math.round(v.sSum)+' mm':'—')+deltaSpan(v.sSumDelta,0,'down')+'</div></div>':'')
      +'</div></div>';
  }

  h+='<div class="scrfoot">Feed Your Health · '+esc(T('footQ'))+'<br><span class="lock">🔒 '+esc(T('lock'))+'</span></div>';

  el('root').innerHTML=h;
}
