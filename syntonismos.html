<script>
'use strict';
const SUPABASE_URL='https://vqmzrmotdqqoswlgfgrn.supabase.co';
const SUPABASE_KEY='sb_publishable_qnxqf2mg_yxMitIjQ5iaAA__Obnd_z1';

// Ίδιο createClient χωρίς options με το Dietologist.html → ίδιο storageKey στο ίδιο origin, οπότε
// αν είσαι ήδη συνδεδεμένος στο Dietologist σε αυτόν τον browser, εδώ μπαίνεις κατευθείαν.

// ── Κατώφλια: ΙΔΙΑ με το app (js/tabs/progress.js, js/tabs/home-diets.js, js/client-list/roster-ui.js).
// Αν αλλάξει κάτι εκεί, άλλαξέ το κι εδώ — αλλιώς η λίστα εδώ και η Αρχική/Πρόοδος θα διαφωνούν.

const CK_WINDOW_DAYS=60;       // πόσες μέρες check-ins φέρνουμε (σερί, κενά, 4 εβδ. ανά ημέρα)

// ── Ημερομηνίες / σκορ τήρησης — αντίγραφο των ck* του js/app-part7.js (ίδια λογική). ──
const dayKey=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today0=()=>{const d=new Date();d.setHours(0,0,0,0);return d;};
const daysAgoKey=n=>{const d=today0();d.setDate(d.getDate()-n);return dayKey(d);};
const daysSince=key=>Math.round((today0()-new Date(key+'T00:00:00'))/86400000);
function weekKeysFor(ref){
  const base=ref==null?new Date():(typeof ref==='string'?new Date(ref+'T00:00:00'):new Date(ref));
  const js=base.getDay(),toMon=(js===0?-6:1-js);
  const mon=new Date(base);mon.setDate(base.getDate()+toMon);mon.setHours(0,0,0,0);
  const a=[];for(let i=0;i<7;i++){const d=new Date(mon);d.setDate(mon.getDate()+i);a.push(dayKey(d));}
  return a;

function weekDates(off){const d=new Date();d.setDate(d.getDate()+(off||0)*7);return weekKeysFor(d);}
function pillarStats(rows){
  let dD=0,dT=0,sD=0,sT=0,wD=0,wT=0,any=false;
  (rows||[]).forEach(r=>{
    if(r.meals_total){dT++;if(r.meals_done>=r.meals_total)dD++;}
    if(r.supps_total){sT++;if(r.supps_done>=r.supps_total)sD++;}
    if(r.water_goal){wT++;if(r.water_glasses>=r.water_goal)wD++;}
    if(r.meals_done>0||r.supps_done>0||r.water_glasses>0)any=true;
  });
  return {dD,dT,sD,sT,wD,wT,any};
}
function overallScore(st){const p=[];if(st.dT)p.push(st.dD/st.dT);if(st.sT)p.push(st.sD/st.sT);if(st.wT)p.push(st.wD/st.wT);return p.length?Math.round(p.reduce((a,b)=>a+b,0)/p.length*100):null;}
function weekScore(byDate,off){const st=pillarStats(weekDates(off).map(k=>byDate[k]).filter(Boolean));return st.any?overallScore(st):null;}
function isGoodDay(r){if(!r)return false;if(r.meals_total&&r.meals_done<r.meals_total)return false;if(r.supps_total&&r.supps_done<r.supps_total)return false;if(r.water_goal&&r.water_glasses<r.water_goal)return false;return true;}
function streak(byDate){let n=0;const d=today0();if(!isGoodDay(byDate[dayKey(d)]))d.setDate(d.getDate()-1);let g=0;while(isGoodDay(byDate[dayKey(d)])){n++;d.setDate(d.getDate()-1);if(++g>365)break;}return n;}

// (js/lib/helpers.js). low/start/streak/weight/hello: μόνο εδώ (το app δεν έχει τέτοια μηνύματα). ──
function gapN(g){const n=Math.round(Number(g));return(isFinite(n)&&n>=2)?n:0;}
function ruDays(n){const m=n%10,h=n%100;return(m===1&&h!==11)?'день':((m>=2&&m<=4&&(h<10||h>=20))?'дня':'дней');}
const MSG={
  el:{hi:fn=>'Γεια σου '+fn+'! ',

// ── Φόρτωση (μόνο ανάγνωση από user_data — δεν γράφουμε ΠΟΤΕ εκεί, βλ. sql/2026-10-02_coord_actions.sql) ──
async function fetchByTokens(table,cols,tokens,orderCol,sinceCol,since){
  const out={},CH=60,PAGE=1000;
  for(let i=0;i<tokens.length;i+=CH){
    const chunk=tokens.slice(i,i+CH);
    for(let from=0;;){
      let q=sb.from(table).select(cols).in('token',chunk);
      if(sinceCol)q=q.gte(sinceCol,since);
      const res=await q.order(orderCol,{ascending:true}).order('token',{ascending:true}).range(from,from+PAGE-1);
      if(res.error)throw res.error;
      const rows=res.data||[];
      rows.forEach(r=>{(out[r.token]=out[r.token]||[]).push(r);});
      if(!rows.length)break;
      from+=rows.length;
    }
  }
  return out;
}
const tokensFor=c=>{const t=(c.prevShareTokens||[]).slice();if(c.shareToken&&t.indexOf(c.shareToken)<0)t.push(c.shareToken);return t;};
function rowsFor(c){
  const toks=tokensFor(c);
  const by={};toks.forEach(t=>(CK[t]||[]).forEach(r=>{by[r.date]=r;}));
  return Object.keys(by).sort().map(k=>by[k]);
}

async function loadAll(){
  if(loading)return;loading=true;loadErr='';spin(true);
  try{
    const [blob,acts]=await Promise.all([
      sb.from('user_data').select('data').eq('user_id',USER.id).maybeSingle(),
      sb.from('coord_actions').select('item_key,client_id,status,until,updated_at')
    ]);
    if(blob.error)throw blob.error;
    const d=(blob.data&&blob.data.data)||{};
    CLIENTS=(d.clients||[]).filter(c=>c&&!c.deleted&&!c.archived);
    if(acts.error){actsOk=false;console.warn('[coord] coord_actions',acts.error);}
    else{actsOk=true;ACTS={};(acts.data||[]).forEach(a=>{ACTS[a.item_key]=a;});}
    const all=[];CLIENTS.forEach(c=>tokensFor(c).forEach(t=>all.push(t)));
    const cur=CLIENTS.map(c=>c.shareToken).filter(Boolean);
    const r=await Promise.allSettled([
      all.length?fetchByTokens('checkins','token,date,meals_done,meals_total,water_glasses,water_goal,supps_done,supps_total',all,'date','date',daysAgoKey(CK_WINDOW_DAYS)):{},
      cur.length?fetchByTokens('client_logs','token,date,weight_kg,note',cur,'date','date',daysAgoKey(45)):{},
      cur.length?fetchByTokens('plan_feedback','token,week_start,breakfast,snacks,lunch,dinner,recipes_ease,ingredients_ease,training_energy,continue_likelihood,low_rating_reasons',cur,'week_start','week_start',daysAgoKey(42)):{},
      cur.length?sb.from('shared_plans').select('token,expires_at,updated_at,created_at').in('token',cur):{data:[]}
    ]);
    if(r[0].status==='fulfilled')CK=r[0].value;else{console.error(r[0].reason);loadErr='Δεν φορτώθηκαν τα check-ins.';}
    if(r[1].status==='fulfilled')LOGS=r[1].value;else{console.error(r[1].reason);loadErr='Δεν φορτώθηκαν τα μηνύματα.';}
    if(r[2].status==='fulfilled')PF=r[2].value;else console.error(r[2].reason);
    if(r[3].status==='fulfilled'&&!r[3].value.error){LINKS={};(r[3].value.data||[]).forEach(x=>{LINKS[x.token]=x;});linksOk=true;}else linksOk=false;
    loadedAt=Date.now();
  }catch(e){
    console.error('[coord] load',e);
    loadErr='Δεν φορτώθηκαν τα δεδομένα. Έλεγξε τη σύνδεση και πάτα ανανέωση.';
  }finally{loading=false;spin(false);render();}
}

function actState(key){
  const a=ACTS[key];if(!a)return null;
  const now=Date.now();
  if(a.status==='snooze'&&a.until&&new Date(a.until).getTime()<=now)return null;
  if(a.status==='sent'&&a.until&&new Date(a.until).getTime()<=now)return null;
  return a;
}
function handledToday(a){return a&&(a.status==='snooze'||a.status==='mute'||daysSince(dayKey(new Date(a.updated_at)))===0);}
async function setAct(item,status,untilDays){
  const prev=ACTS[item.key];
  const until=untilDays?new Date(Date.now()+untilDays*86400000).toISOString():null;
  const row={item_key:item.key,client_id:item.c.id,status,until,updated_at:new Date().toISOString()};
  ACTS[item.key]=row;render();
  if(!actsOk){return true;}
  const res=await sb.from('coord_actions').upsert(row,{onConflict:'user_id,item_key'});
  if(res.error){
    console.error('[coord] save',res.error);
    if(prev)ACTS[item.key]=prev;else delete ACTS[item.key];render();
    toast('Δεν αποθηκεύτηκε. Δοκίμασε ξανά.');return false;
  }
  return true;
}
async function clearAct(key){
  const prev=ACTS[key];delete ACTS[key];render();
  if(!actsOk||!prev)return;
  const res=await sb.from('coord_actions').delete().eq('item_key',key);
  if(res.error){ACTS[key]=prev;render();toast('Δεν έγινε αναίρεση. Δοκίμασε ξανά.');}
}

// ── Η ουρά: ίδια σήματα με Αρχική / Πρόοδο / Μηνύματα του app ──
function clientInfo(c){
  const rows=rowsFor(c),by={};rows.forEach(r=>{by[r.date]=r;});
  const last=rows.length?rows[rows.length-1].date:null;
  const hasPlan=!!(c.weekPlan&&Object.keys(c.weekPlan).length);
  let expDays=null;
  if(c.planGeneratedAt&&hasPlan){const th=c.renewalDays>0?c.renewalDays:PLAN_RENEWAL_DAYS;expDays=th-Math.floor((Date.now()-c.planGeneratedAt)/86400000);}
  const wl=(c.weightLog||[]).filter(e=>e&&e.weight);
  return {rows,by,last,gap:last?daysSince(last):Infinity,hasPlan,expDays,
    score:rows.length?weekScore(by,0):null,prev:rows.length?weekScore(by,-1):null,
    streak:rows.length?streak(by):0,wl,
    muted:!!(c.progressMutedUntil&&Date.now()<c.progressMutedUntil),
    snoozed:!!(c.attentionSnoozeUntil&&Date.now()<c.attentionSnoozeUntil)};
}
const reasonSnoozed=(c,r)=>!!(c.attentionSnoozeReasons&&c.attentionSnoozeReasons[r]&&Date.now()<c.attentionSnoozeReasons[r]);
const noteText=n=>(n||'').replace(/^\[tag:(travel|party|sick)\]\s*/,'').trim();
const noteTag=n=>{const m=/^\[tag:(travel|party|sick)\]/.exec(n||'');return m?{travel:'Ταξίδι',party:'Γιορτή',sick:'Άρρωστος/η'}[m[1]]:null;};
function pfLow(e){
  const keys=PF_KEYS.filter(k=>e[k]!=null&&e[k]<=PF_STAR_MAX);
  const nps=e.continue_likelihood!=null&&e.continue_likelihood<=PF_NPS_MAX;
  return(keys.length||nps)?{keys,nps}:null;
}
const pfHandled=(c,w)=>!!((c.pfSeen&&c.pfSeen[w])||(c.pfReplies&&Object.keys(c.pfReplies).some(k=>k.indexOf(w+'|')===0)));
function pfWhy(e,low){
  const parts=low.keys.map(k=>(PF_LABELS[k]||k)+' '+e[k]+'/5');
  if(low.nps)parts.unshift('συνέχιση '+e.continue_likelihood+'/10');
  return 'Χαμηλή αξιολόγηση: '+parts.join(', ');
}

function buildItems(){
  const items=[];
  const mk=(c,kind,ref,o)=>Object.assign({c,kind,ref,key:c.id+'|'+kind+'|'+ref},o);
  CLIENTS.forEach(c=>{
    const I=clientInfo(c);
    // A. Θέλουν απάντηση: σημειώσεις & χαμηλές αξιολογήσεις από το λινκ, όσες δεν έχεις απαντήσει/δει στο app
    if(c.shareToken){
      (LOGS[c.shareToken]||[]).forEach(e=>{
        const t=noteText(e.note);
        if(!t||daysSince(e.date)>MSG_WINDOW_DAYS)return;
        if((c.noteReplies&&c.noteReplies[e.date])||(c.noteSeen&&c.noteSeen[e.date]))return;
        items.push(mk(c,'note',e.date,{group:'reply',why:'«'+t+'»',text:t,date:e.date,tag:noteTag(e.note)}));
      });
      const pfs=(PF[c.shareToken]||[]).slice().sort((a,b)=>a.week_start<b.week_start?1:-1);
      const e=pfs[0];
      if(e&&daysSince(e.week_start)<=MSG_WINDOW_DAYS&&!pfHandled(c,e.week_start)){
        const low=pfLow(e);
        if(low)items.push(mk(c,'pf',e.week_start,{group:'reply',why:pfWhy(e,low),text:pfWhy(e,low),date:e.week_start}));
      }
    }
    // B. Χρειάζονται σπρώξιμο (κανόνες Πρόοδος: nudge / low) + λινκ που δεν ξεκίνησε ποτέ
    if(!I.muted&&I.hasPlan&&c.shareToken){
      const contactDays=c.lastDietologistContact?Math.floor((Date.now()-c.lastDietologistContact)/86400000):null;
      const nudgedRecently=contactDays!=null&&contactDays<I.gap&&contactDays<NUDGE_RECONTACT_DAYS;
      if(I.rows.length&&I.gap>=NUDGE_MIN_GAP&&!nudgedRecently){
        items.push(mk(c,'nudge',I.last,{group:'nudge',gap:I.gap,why:'Δεν καταγράφει εδώ και '+nDays(I.gap)+(I.prev?' · προηγ. εβδ. '+I.prev+'%':'')}));
      }else if(I.score!=null&&I.gap<=LOW_FRESH_DAYS&&I.score<LOW_MAX){
        const d=I.prev!=null?I.score-I.prev:null;
        items.push(mk(c,'low',weekDates(0)[0],{group:'nudge',why:'Τήρηση '+I.score+'% αυτή την εβδ.'+(d!=null&&d<=-5?' · ▼'+Math.abs(d)+' από την προηγ.':'')}));
      }else if(!I.rows.length&&linksOk&&LINKS[c.shareToken]){
        const pub=(LINKS[c.shareToken].updated_at||LINKS[c.shareToken].created_at||'').slice(0,10);
        const pd=pub?daysSince(pub):0;
        if(pd>=2&&pd<=21)items.push(mk(c,'start',pub,{group:'nudge',why:'Δεν ξεκίνησε να καταγράφει (λινκ πριν '+nDays(pd)+')'}));
      }
    }
    // C. Για το γραφείο: θέλουν δουλειά στο Dietologist
    const off=[];   // [ref, why] — ΜΙΑ γραμμή ανά πελάτη, με όλους τους λόγους μαζί
    if(!I.snoozed){
      const flagged=(c.appointments||[]).slice().reverse().find(a=>a&&a.flagged);
      if(flagged&&!reasonSnoozed(c,'flag'))off.push(['flag:'+(flagged.date||'x'),'Σημείωση ραντεβού για παρακολούθηση'+(flagged.date?' ('+flagged.date+')':'')]);
      if(c.intakeToken&&c.intakeStatus==='sent'&&c.intakeSentAt&&!reasonSnoozed(c,'intake')){
        const g=Math.floor((Date.now()-new Date(c.intakeSentAt))/86400000);
        if(g>=INTAKE_PENDING_DAYS)off.push(['intake:'+String(c.intakeSentAt).slice(0,10),'Δεν συμπλήρωσε το ερωτηματολόγιο ('+nDays(g)+')']);
      }
      if(c.intakeToken&&c.intakeStatus==='submitted'&&c.intakeSubmittedAt&&!I.hasPlan){
        off.push(['intakeDone:'+String(c.intakeSubmittedAt).slice(0,10),'Συμπλήρωσε το ερωτηματολόγιο · χρειάζεται πλάνο']);
      }else if(!I.hasPlan&&!(c.intakeToken&&c.intakeStatus==='sent')&&!reasonSnoozed(c,'noplan')){
        off.push(['noplan:'+'x','Δεν έχει πλάνο ακόμα']);
      }
      if(I.expDays!=null&&I.expDays<=EXPIRING_DAYS&&!reasonSnoozed(c,'renewal')){
        off.push(['renew:'+String(c.planGeneratedAt),I.expDays<0?'Το πλάνο πέρασε τις '+(c.renewalDays||PLAN_RENEWAL_DAYS)+' μέρες (πριν '+nDays(-I.expDays)+')':I.expDays===0?'Το πλάνο θέλει ανανέωση σήμερα':'Το πλάνο θέλει ανανέωση σε '+nDays(I.expDays)]);
      }
      if(c.shareToken&&linksOk){
        const L=LINKS[c.shareToken];
        const ex=L&&L.expires_at?Math.floor((new Date(L.expires_at)-Date.now())/86400000):null;
        if(!L)off.push(['link:'+'missing','Το λινκ του δεν υπάρχει πια · ξαναδημοσίευσε']);
        else if(ex!=null&&ex<=3)off.push(['link:'+String(L.expires_at).slice(0,10),ex<0?'Το λινκ του έληξε · ξαναδημοσίευσε':'Το λινκ του λήγει σε '+nDays(ex)]);
      }
    }
    // Το ref αλλάζει όταν αλλάξουν οι λόγοι, οπότε ένας ΝΕΟΣ λόγος ξαναφέρνει τον πελάτη στη λίστα.
    if(off.length)items.push(mk(c,'office',off.map(o=>o[0]).sort().join('+'),{group:'office',why:off.map(o=>o[1]).join(' · ')}));
    // D. Καλά νέα (ένα ανά πελάτη· το βάρος προηγείται του σερί)
    let kudo=null;
    if(I.wl.length>=2&&(c.goalMain==='loss'||c.goalMain==='gain')){
      const f=I.wl[0],l=I.wl[I.wl.length-1],dl=Math.round((l.weight-f.weight)*10)/10;
      const good=c.goalMain==='loss'?dl<=-2:dl>=2;
      const kg=(dl>0?'+':'−')+String(Math.abs(dl)).replace('.',',');
      if(good&&l.date&&daysSince(l.date)<=14)kudo=mk(c,'weight',l.date,{group:'kudos',kg,why:kg+' kg από την αρχή ('+f.date+')'+(I.streak>=7?' · '+nDays(I.streak)+' σερί':'')});
    }
    if(!kudo&&I.streak>=7)kudo=mk(c,'streak',weekDates(0)[0],{group:'kudos',n:I.streak,why:nDays(I.streak)+' σερί με όλους τους στόχους'});
    if(kudo)items.push(kudo);
  });
  return items;
}

function draftFor(it){
  const c=it.c,d=dictFor(c),fn=firstName(c);
  const url=c.shareToken?PORTAL_BASE+'?t='+c.shareToken:'';
  switch(it.kind){
    case 'note':return d.replyNote(fn,it.text);
    case 'pf':return d.replyPf(fn);
    case 'nudge':return d.nudge(fn,url+'&go=today',it.gap);
    case 'low':return d.low(fn);
    case 'start':return d.start(fn,url+'&go=today');
    case 'streak':return d.streak(fn,it.n);
    case 'weight':return d.weight(fn,it.kg);
    default:return d.hi(fn);
  }
}

function weekdayChart(){
  // Μ.Ο. τήρησης ανά ημέρα της εβδομάδας, 4 εβδομάδες, όλοι οι πελάτες με λινκ (όπως το «🗓 Τήρηση ανά ημέρα» της Αρχικής).
  const from=weekDates(-3)[0],to=dayKey(new Date());
  const sum=[0,0,0,0,0,0,0],cnt=[0,0,0,0,0,0,0];
  CLIENTS.forEach(c=>rowsFor(c).forEach(r=>{
    if(r.date<from||r.date>to)return;
    const s=overallScore(pillarStats([r]));if(s==null)return;
    const js=new Date(r.date+'T00:00:00').getDay(),wd=js===0?6:js-1;
    sum[wd]+=s;cnt[wd]++;
  }));
  const L=['Δευ','Τρί','Τετ','Πέμ','Παρ','Σάβ','Κυρ'],FULL=['Δευτέρα','Τρίτη','Τετάρτη','Πέμπτη','Παρασκευή','Σάββατο','Κυριακή'];
  const vals=sum.map((s,i)=>cnt[i]?Math.round(s/cnt[i]):null);
  if(vals.every(v=>v==null))return '';
  const valid=vals.map((v,i)=>({v,i})).filter(x=>x.v!=null);
  const worst=valid.reduce((a,b)=>b.v<a.v?b:a),best=valid.reduce((a,b)=>b.v>a.v?b:a);
  const sel=UI.day!=null?UI.day:worst.i;
  const W=320,H=124,bw=30,gap=(W-7*bw)/6;
  const col=v=>v>=66?'var(--teal)':v>=33?'var(--warn)':'var(--bad)';
  const bars=vals.map((v,i)=>{const x=i*(bw+gap),h=v==null?0:Math.max(2,v/100*(H-36)),y=H-20-h,on=i===sel;
    return '<g data-a="day" data-d="'+i+'" style="cursor:pointer"><rect x="'+x+'" y="0" width="'+bw+'" height="'+H+'" fill="transparent"/>'
      +(v==null?'':'<rect x="'+x+'" y="'+y+'" width="'+bw+'" height="'+h+'" rx="5" fill="'+col(v)+'" opacity="'+(on?1:.5)+'"/>'
      +'<text x="'+(x+bw/2)+'" y="'+(y-5)+'" text-anchor="middle" font-size="10.5" fill="var(--muted)">'+v+'%</text>')
      +'<text x="'+(x+bw/2)+'" y="'+(H-5)+'" text-anchor="middle" font-size="11" fill="'+(on?'var(--ink)':'var(--muted)')+'" font-weight="'+(on?700:400)+'">'+L[i]+'</text></g>';}).join('');
  const sv=vals[sel];
  let note=sv==null?FULL[sel]+': δεν υπάρχουν καταγραφές.':FULL[sel]+': μέση τήρηση '+sv+'% ('+cnt[sel]+' καταγραφές σε 4 εβδομάδες).';
  if(sel===worst.i&&worst.v<best.v-10)note+=' Είναι η πιο αδύναμη μέρα. Ίσως αξίζει ένα μήνυμα την προηγούμενη μέρα.';
  if(sel===best.i)note+=' Η καλύτερη μέρα της εβδομάδας.';
  return '<section class="sec"><div class="sec-h"><i class="ti ti-calendar-stats" aria-hidden="true"></i>Τήρηση ανά ημέρα<span class="n">4 εβδ.</span></div>'
    +'<div class="chart"><svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Μέση τήρηση ανά ημέρα της εβδομάδας">'+bars+'</svg><div class="chart-note">'+esc(note)+'</div></div></section>';
}

function kpis(){
  let n=0,sum=0,pn=0,psum=0;
  CLIENTS.forEach(c=>{const I=clientInfo(c);if(I.score!=null){n++;sum+=I.score;}if(I.prev!=null){pn++;psum+=I.prev;}});
  const avg=n?Math.round(sum/n):null,pavg=pn?Math.round(psum/pn):null;
  const wow=(avg!=null&&pavg!=null&&Math.abs(avg-pavg)>=3)?(avg>pavg?'<span class="up">▲'+(avg-pavg)+'</span>':'<span class="down">▼'+(pavg-avg)+'</span>'):'';
  const exp=CLIENTS.filter(c=>{const I=clientInfo(c);return I.expDays!=null&&I.expDays<=EXPIRING_DAYS;}).length;
  const withPlan=CLIENTS.filter(c=>c.weekPlan&&Object.keys(c.weekPlan).length).length;
  return '<div class="kpis"><div class="kpi"><b>'+withPlan+'</b><span>Με ενεργό πλάνο</span></div>'
    +'<div class="kpi"><b>'+(avg==null?'—':avg+'%')+' '+wow+'</b><span>Μ.Ο. τήρησης εβδ.</span></div>'
    +'<div class="kpi"><b>'+exp+'</b><span>Πλάνα λήγουν σε 7 ημ.</span></div></div>';
}

function allMessages(){
  const out=[];
  CLIENTS.forEach(c=>{
    if(!c.shareToken)return;
    (LOGS[c.shareToken]||[]).forEach(e=>{const t=noteText(e.note);if(!t)return;
      const key=c.id+'|note|'+e.date;
      const handled=!!((c.noteReplies&&c.noteReplies[e.date])||(c.noteSeen&&c.noteSeen[e.date])||actState(key));
      out.push({c,kind:'note',key,date:e.date,text:t,tag:noteTag(e.note),weight:e.weight_kg,handled,group:'reply'});});
    (PF[c.shareToken]||[]).forEach(e=>{const low=pfLow(e);if(!low)return;
      const key=c.id+'|pf|'+e.week_start;
      const handled=!!(pfHandled(c,e.week_start)||actState(key));
      out.push({c,kind:'pf',key,date:e.week_start,text:pfWhy(e,low),handled,group:'reply'});});
  });
  return out.sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:0);
}

    // <a target=_blank> αντί για window.open(…,'noopener'): εκείνο επιστρέφει πάντα null, οπότε
    // δεν ξέρεις αν άνοιξε. Το κλικ σε link ανοίγει το WhatsApp και στο iOS και στο Android.
    const a=document.createElement('a');a.href=url;a.target='_blank';a.rel='noopener';document.body.appendChild(a);a.click();a.remove();
  }else{
    location.href='mailto:'+encodeURIComponent(c.email).replace(/%40/g,'@')+'?subject='+encodeURIComponent(dictFor(c).subj)+'&body='+encodeURIComponent(txt);
  }
  closeSheet();
  if(it.kind==='free')return;
  // Υπενθυμίσεις «λήγουν» σε 7 μέρες (όπως το PROGRESS_NUDGE_RECONTACT_DAYS)· απαντήσεις/μπράβο μένουν.
  const exp=(it.kind==='nudge'||it.kind==='low'||it.kind==='start')?SENT_EXPIRES_DAYS:0;
  if(await setAct(it,'sent',exp))toast('Σημειώθηκε ως «Στάλθηκε»',()=>clearAct(it.key));
}
function openMore(it){
  sheet(shortName(it.c.name),'<div class="sec-sub">'+esc(it.why)+'</div>'
    +'<button class="opt" data-a="snooze" data-k="'+esc(it.key)+'" data-d="1"><i class="ti ti-clock" aria-hidden="true"></i>Ξαναδείξε το αύριο</button>'
    +'<button class="opt" data-a="snooze" data-k="'+esc(it.key)+'" data-d="3"><i class="ti ti-clock" aria-hidden="true"></i>Ξαναδείξε το σε 3 μέρες</button>'
    +'<button class="opt" data-a="snooze" data-k="'+esc(it.key)+'" data-d="7"><i class="ti ti-clock" aria-hidden="true"></i>Ξαναδείξε το σε μία εβδομάδα</button>'
    +'<button class="opt" data-a="mute" data-k="'+esc(it.key)+'"><i class="ti ti-bell-off" aria-hidden="true"></i>Μην το ξαναδείξεις για αυτόν τον λόγο</button>'
    +'<button class="opt" data-a="client" data-c="'+esc(it.c.id)+'"><i class="ti ti-user" aria-hidden="true"></i>Δες την καρτέλα</button>');
}
function openClient(id){
  const c=CLIENTS.find(x=>x.id===id);if(!c)return;
  const I=clientInfo(c),phone=phoneIntl(c.phone);
  const days=[];for(let i=13;i>=0;i--){const r=I.by[daysAgoKey(i)];days.push(r?overallScore(pillarStats([r])):null);}
  const open=ITEMS.filter(it=>it.c===c&&isOpen(it));
  const msgs=allMessages().filter(m=>m.c===c).slice(0,3);
  const wl=I.wl,w=wl.length>=2?esc(String(wl[0].weight).replace('.',','))+' → '+esc(String(wl[wl.length-1].weight).replace('.',','))+' kg ('+esc(wl[0].date)+' → '+esc(wl[wl.length-1].date)+')':wl.length?esc(String(wl[0].weight).replace('.',','))+' kg ('+esc(wl[0].date)+')':'Χωρίς μετρήσεις';
  const exp=I.expDays==null?'—':I.expDays<0?'Έληξε πριν '+nDays(-I.expDays):'Σε '+nDays(I.expDays);
  sheet(c.name||'Πελάτης',
    '<div class="meta" style="margin-top:0"><span class="tag" style="margin:0">'+esc((c.lang||'el').toUpperCase())+'</span>'+(phone?'<span>+'+esc(phone)+'</span>':'')+(c.group?'<span>· '+esc(c.group)+'</span>':'')+'</div>'
    +(I.rows.length?'<div class="chart" style="padding:10px 12px"><div style="display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted)"><span>Τήρηση 14 ημερών</span><span class="pct '+pctCls(I.score)+'">'+(I.score==null?'—':I.score+'%')+'</span></div>'+sparkSvg(days,300,56)+'</div>'
      :'<div class="quote">'+(c.shareToken?'Δεν έχει καταγράψει ακόμα στο λινκ.':'Δεν έχει λινκ πλάνου.')+'</div>')
    +'<div class="stat"><div><b>'+(I.score==null?'—':I.score+'%')+'</b>αυτή την εβδ.'+(I.prev!=null?' (προηγ. '+I.prev+'%)':'')+'</div>'
    +'<div><b>'+(I.last?ago(I.last):'—')+'</b>τελευταία καταγραφή</div>'
    +'<div><b>'+(I.streak||0)+'</b>μέρες σερί</div><div><b>'+exp+'</b>ανανέωση πλάνου</div>'
    +'<div style="grid-column:1/-1"><b style="font-size:14px">'+w+'</b>βάρος (μετρήσεις γραφείου)</div></div>'
    +(open.length?'<div class="sec-h" style="margin-top:6px">Εκκρεμεί</div><div class="list" style="margin-bottom:12px">'+open.map(it=>rowHtml(it,false)).join('')+'</div>':'')
    +(msgs.length?'<div class="sec-h">Τελευταία μηνύματα</div>'+msgs.map(m=>'<div class="quote">'+esc(m.text)+'<small>'+ago(m.date)+'</small></div>').join(''):'')
    +'<div class="btns" style="margin-top:6px">'+((phone||c.email)?'<button class="act pri" data-a="free" data-c="'+esc(c.id)+'"><i class="ti ti-message" aria-hidden="true"></i>Μήνυμα</button>':'')
    +'<a class="act" href="'+APP_URL+'"><i class="ti ti-external-link" aria-hidden="true"></i>Άνοιγμα στο app</a></div>');
}

// ── Συμβάντα ──
document.addEventListener('click',async e=>{
  const el=e.target.closest('[data-a]');if(!el)return;
  const a=el.dataset.a;
  if(a==='scrim'&&e.target!==el)return;
  const it=el.dataset.k?(BYKEY[el.dataset.k]||allMessages().find(m=>m.key===el.dataset.k)):null;
  switch(a){
    case 'tab':UI.tab=el.dataset.t;saveUI();render();window.scrollTo(0,0);break;
    case 'refresh':loadAll();break;
    case 'theme':toggleTheme();break;
    case 'compose':if(it)openCompose(it);break;
    case 'composeMsg':if(it)openCompose(it);break;
    case 'free':{const c=CLIENTS.find(x=>x.id===el.dataset.c);if(c)openCompose({c,kind:'free',key:''});break;}
    case 'send':doSend(el.dataset.via);break;
    case 'seen':case 'seenMsg':if(it&&await setAct(it,'seen'))toast('Σημειώθηκε ότι το είδες',()=>clearAct(it.key));break;
    case 'flag':if(it&&await setAct(it,'flag',14))toast('Σημαία για το γραφείο',()=>clearAct(it.key));break;
    case 'more':if(it)openMore(it);break;
    case 'snooze':if(it){closeSheet();const d=+el.dataset.d;if(await setAct(it,'snooze',d))toast(d===1?'Θα το ξαναδείς αύριο':'Θα το ξαναδείς σε '+d+' μέρες',()=>clearAct(it.key));}break;
    case 'mute':if(it){closeSheet();if(await setAct(it,'mute'))toast('Δεν θα ξαναεμφανιστεί για αυτόν τον λόγο',()=>clearAct(it.key));}break;
    case 'undo':clearAct(el.dataset.k);break;
    case 'client':openClient(el.dataset.c);break;
    case 'filter':UI.filter=el.dataset.f;saveUI();render();break;
    case 'day':UI.day=+el.dataset.d;render();break;
    case 'showdone':UI.showDone=!UI.showDone;render();break;
    case 'close':case 'scrim':closeSheet();break;
    case 'toastUndo':if(undoFn)undoFn();document.getElementById('toast').hidden=true;break;
    case 'logout':await sb.auth.signOut();location.reload();break;
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet();});
// Γυρνώντας στη σελίδα (π.χ. από το WhatsApp) ανανεώνει αν πέρασαν 2+ λεπτά.
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&USER&&Date.now()-loadedAt>120000)loadAll();});

// ── Σύνδεση ──
function trErr(m){m=String(m||'');if(/invalid login/i.test(m))return 'Λάθος email ή κωδικός.';if(/email not confirmed/i.test(m))return 'Το email δεν έχει επιβεβαιωθεί.';if(/rate|too many/i.test(m))return 'Πολλές προσπάθειες. Δοκίμασε σε λίγο.';if(/fetch|network/i.test(m))return 'Δεν υπάρχει σύνδεση στο internet.';return m;}
function showLogin(){document.getElementById('login').hidden=false;document.getElementById('main').hidden=true;document.getElementById('nav').hidden=true;}
function showApp(){document.getElementById('login').hidden=true;document.getElementById('main').hidden=false;document.getElementById('nav').hidden=false;render();loadAll();}
document.getElementById('loginForm').addEventListener('submit',async e=>{
  e.preventDefault();
  const em=document.getElementById('em').value.trim(),pw=document.getElementById('pw').value,err=document.getElementById('loginErr'),btn=document.getElementById('loginBtn');
  if(!em||!pw){err.textContent='Γράψε email και κωδικό.';return;}
  err.textContent='';btn.disabled=true;btn.textContent='Σύνδεση…';
  const res=await sb.auth.signInWithPassword({email:em,password:pw});
  btn.disabled=false;btn.textContent='Σύνδεση';
  if(res.error){err.textContent=trErr(res.error.message);return;}
  USER=res.data.user;showApp();
});
document.getElementById('forgotBtn').addEventListener('click',async()=>{
  const em=document.getElementById('em').value.trim(),err=document.getElementById('loginErr');
  if(!em){err.textContent='Γράψε πρώτα το email σου.';return;}
  // Η αλλαγή κωδικού γίνεται στο Dietologist.html (είναι το URL που έχει επιτραπεί στο Supabase).
  const res=await sb.auth.resetPasswordForEmail(em,{redirectTo:'https://feedyourhealth.github.io/Dietologist.html'});
  err.textContent=res.error?trErr(res.error.message):'Σου στείλαμε email με link για νέο κωδικό. Μετά γύρνα εδώ και συνδέσου.';
});
document.getElementById('em').addEventListener('input',()=>{document.getElementById('loginErr').textContent='';});

(async function boot(){
  const {data}=await sb.auth.getSession();
  if(data&&data.session&&data.session.user){USER=data.session.user;showApp();}else showLogin();
})();
</script>
