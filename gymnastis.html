function teamFlags(c,X){
  const tm=c.team||{}, out=[];
  if(tm.ea!=null){ if(tm.ea<30) out.push({lv:'bad',t:X.fEaLow}); else if(tm.ea<45) out.push({lv:'warn',t:X.fEaMid}); }
  if(tm.fastLoss) out.push({lv:'warn',t:X.fFast});
  const lm=tm.lastMeas||c.measDate; if(lm&&daysTo(lm)<=-28) out.push({lv:'warn',t:X.fMeas});
  if(c.comp&&daysTo(c.comp.date)>=0&&daysTo(c.comp.date)<=21) out.push({lv:'info',t:X.fComp.replace('{n}',daysTo(c.comp.date))});
  return out;
}

}
function renderHub(s){
  const lang=s.lang==='en'?'en':'el', X=T[lang], seen=seenGet();
  document.documentElement.lang=lang;
  document.title='Feed Your Health — '+(s.trainer&&s.trainer.name||'');
  const first=(s.trainer&&s.trainer.greet)||String(s.trainer&&s.trainer.name||'').split(/\s+/)[0];
  const L=(s.clients||[]);
  let h='<div class="who"><div class="eb">'+esc(X.hubSub)+'</div><h1>'+esc(X.hubHi+' '+first)+' 👋</h1>'
    +'<div class="upd">'+L.length+' '+esc(X.hubN)+' · '+esc(X.upd)+' '+esc(fmtD(String(s.updatedAt||'').slice(0,10)))+'</div></div>';
  if(!L.length) h+='<div class="card" style="color:var(--muted)">'+esc(X.hubEmpty)+'</div>';
  const canTeam=L.length>=2 && (s.trainer&&s.trainer.kind==='coach' || L.length>=4);
  let view='list'; try{ view=localStorage.getItem('fyh_hub_view')||((s.trainer&&s.trainer.kind==='coach'&&L.length>=4)?'team':'list'); }catch(e){}
  if(!canTeam) view='list';
  if(canTeam){
    const nAtt=L.filter(c=>teamFlags(c,X).some(f=>f.lv!=='info')).length;
    h+='<div class="seg" role="tablist"><button role="tab" aria-pressed="'+(view==='list')+'" onclick="setHubView(\'list\')">'+esc(X.vList)+'</button>'
      +'<button role="tab" aria-pressed="'+(view==='team')+'" onclick="setHubView(\'team\')">'+esc(X.vTeam)+(nAtt?' <span class="cnt">'+nAtt+'</span>':'')+'</button></div>';
  }
  if(view==='team'){
    const rows=L.map(c=>({c:c,f:teamFlags(c,X)})).sort((a,b)=>rank(b.f)-rank(a.f)||String(a.c.name).localeCompare(String(b.c.name)));
    const anyWk=L.some(c=>c.team&&c.team.wk);
    h+='<div class="card" style="padding:8px 6px"><div class="scroll"><table class="team"><thead><tr><th>'+esc(X.tAth)+'</th><th>'+esc(X.tMeas)+'</th><th>'+esc(X.bf)+'</th><th>'+esc(X.tTrend)+'</th>'+(anyWk?'<th>'+esc(X.tWk)+'</th>':'')+'<th>'+esc(X.tFlag)+'</th></tr></thead><tbody>'
      +rows.map(r=>{ const c=r.c, tm=c.team||{}, lm=tm.lastMeas||c.measDate, old=lm&&daysTo(lm)<=-28;
        return '<tr><td><a href="?t='+encodeURIComponent(c.token)+'&h='+encodeURIComponent(HUB)+'">'+esc(c.name)+'</a></td>'
          +'<td'+(old?' style="color:var(--bad)"':'')+'>'+esc(fmtDs(lm))+'</td>'
          +'<td>'+(c.bf!=null?nf(c.bf,lang)+'%':'—')+'</td>'
          +'<td>'+(c.dBf!=null?delta(c.dBf,lang,true):'—')+'</td>'
          +(anyWk?'<td>'+(tm.wk?(tm.wk.done+'/'+tm.wk.planned+(tm.wk.planned&&tm.wk.done>=tm.wk.planned?' ✓':'')):'<span style="color:var(--faint)">—</span>')+'</td>':'')
          +'<td class="fl">'+(r.f.length?r.f.map(f=>'<span class="tf '+f.lv+'">'+esc(f.t)+'</span>').join(''):'<span class="tf ok">'+esc(X.fOk)+'</span>')+'</td></tr>'; }).join('')
      +'</tbody></table></div></div>'
      +'<div class="foot" style="text-align:left;margin:0 4px 12px">'+esc(X.teamNote)+'</div>';
  } else L.forEach(c=>{
    const isNew=c.sentAt && seen[c.token]!==c.sentAt;
    const age=c.measDate?-daysTo(c.measDate):0, isOld=age>56;
    const ini=String(c.name||'?').trim().split(/\s+/).slice(0,2).map(w=>w.charAt(0)).join('').toUpperCase();
    h+='<a class="card hubc'+(isOld?' old':'')+'" href="?t='+encodeURIComponent(c.token)+'&h='+encodeURIComponent(HUB)+'" onclick="seenSet('+esc(JSON.stringify(c.token))+','+esc(JSON.stringify(c.sentAt||''))+')">'
      +'<span class="av">'+esc(ini)+'</span>'
      +'<span class="hb"><b>'+esc(c.name)+'</b><small>'+esc(X.meas2)+' '+esc(fmtD(c.measDate))
      +(c.bf!=null?' · '+esc(X.bf)+' '+nf(c.bf,lang)+'%'+(c.dBf!=null?' '+delta(c.dBf,lang,true):''):(c.w!=null?' · '+nf(c.w,lang)+' kg':''))+'</small>'
      +(c.comp&&daysTo(c.comp.date)>=0?'<small class="cmp">🏆 '+esc(c.comp.name||'')+' · '+esc(daysTo(c.comp.date)===0?X.today:X.inDays.replace('{n}',daysTo(c.comp.date)))+(c.comp.cls?' · −'+nf(c.comp.cls,lang)+' kg':'')+'</small>':'')+'</span>'
      +(isOld?'<small class="oldt">'+esc(X.oldAgo.replace('{n}',Math.floor(age/7)))+'</small>':'')
      +(isOld?'<span class="nw ol">'+esc(X.old)+'</span>':(isNew?'<span class="nw">'+esc(X.hubNew)+'</span>':''))+'<span class="chev">›</span></a>';
  });
  window.__HUBSNAP=s;
  const wa=String(s.wa||'').replace(/[^0-9]/g,'');
  h+='<div class="acts">'+(wa?'<a class="btn wa" target="_blank" rel="noopener" href="https://wa.me/'+esc(wa)+'">'+esc(X.reply)+'</a>':'')
    +'<button class="btn" onclick="window.print()">'+esc(X.print)+'</button></div>';
  h+='<div class="foot">'+esc(X.hubOnly)+'<br>'+esc(X.hubSave)+'</div>';
  el('root').innerHTML=h;
}

function daysTo(ymd){ const t=new Date(); t.setHours(0,0,0,0); return Math.round((new Date(ymd+'T00:00:00')-t)/86400000); }
function fmtD(ymd){ const p=String(ymd||'').split('-'); return p.length===3?(+p[2])+'/'+(+p[1])+'/'+p[0]:''; }
function fmtDs(ymd){ const p=String(ymd||'').split('-'); return p.length===3?(+p[2])+'/'+(+p[1]):''; }
function nf(v,lang){ return v==null?'—':String(v).replace('.',lang==='en'?'.':','); }
function delta(v,lang,goodWhenDown){
  if(v==null||isNaN(v)) return '';
  const r=Math.round(v*10)/10;
  if(r===0) return '<span class="d n">±0</span>';
  const good=goodWhenDown==null?null:(goodWhenDown?r<0:r>0);
  return '<span class="d '+(good==null?'n':good?'g':'b')+'">'+(r>0?'+':'−')+nf(Math.abs(r),lang)+'</span>';
}
function fill(s,o){ return s.replace(/\{(\w+)\}/g,(m,k)=>o[k]); }

function chartSvg(meas,lang){
  const key=meas.every(m=>m.bf!=null)?'bf':'w';
  const vals=meas.map(m=>m[key]);
  const W=460,H=130,px=28,top=22,bot=24;
  let mn=Math.min(...vals),mx=Math.max(...vals); if(mx-mn<0.5){ mn-=0.5; mx+=0.5; }
  const x=i=>px+(meas.length===1?(W-2*px)/2:i*(W-2*px)/(meas.length-1));
  const y=v=>top+(mx-v)*(H-top-bot)/(mx-mn);
  const pts=meas.map((m,i)=>x(i).toFixed(1)+','+y(m[key]).toFixed(1)).join(' ');
  let s='<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="'+esc(key==='bf'?T[lang].bf:T[lang].w)+'">';
  s+='<polyline points="'+pts+'" fill="none" stroke="var(--teal)" stroke-width="2.5" stroke-linejoin="round"/>';
  meas.forEach((m,i)=>{
    s+='<circle cx="'+x(i).toFixed(1)+'" cy="'+y(m[key]).toFixed(1)+'" r="4" fill="var(--teal)"/>';
    s+='<text x="'+x(i).toFixed(1)+'" y="'+(y(m[key])-8).toFixed(1)+'" text-anchor="middle">'+esc(nf(m[key],lang)+(key==='bf'?'%':''))+'</text>';
    s+='<text x="'+x(i).toFixed(1)+'" y="'+(H-6)+'" text-anchor="middle">'+esc(fmtDs(m.d))+'</text>';
  });
  return s+'</svg><div class="lg"><span>'+esc(key==='bf'?T[lang].bf:T[lang].w+' (kg)')+'</span></div>';
}

function render(){
  const s=SNAP, lang=s.lang==='en'?'en':'el', X=T[lang];
  document.documentElement.lang=lang;
  document.title='Feed Your Health — '+(s.client&&s.client.name||'');
  const M=s.meas||[], L=M[M.length-1], P=M.length>1?M[M.length-2]:null, F=M[0];
  let h=(HUB?'<a class="back" href="?h='+encodeURIComponent(HUB)+'">'+esc(X.back)+'</a>':'')+'<div class="who"><div class="eb">'+esc(X.eb+' '+(s.trainer&&s.trainer.kind==='coach'?X.coach:X.trainer))+(s.trainer&&s.trainer.name?' · '+esc(s.trainer.name):'')+'</div>'
    +'<h1>'+esc(s.client&&s.client.name||'')+'</h1>'
    +'<div class="upd">'+esc(X.meas)+' '+esc(fmtD(L.d))+' · '+esc(X.by)+' '+esc(s.from||'Feed Your Health')+'</div></div>';

  const tile=(l,v,unit,d)=>'<div class="tile"><div class="l">'+esc(l)+'</div><div class="v">'+v+(unit?'<span style="font-size:.8rem;font-weight:600"> '+unit+'</span>':'')+(d||'')+'</div></div>';
  h+='<div class="tiles">'
    +tile(X.w,nf(L.w,lang),'kg',P?delta(L.w-P.w,lang,null):'')
    +(L.bf!=null?tile(X.bf,nf(L.bf,lang),'%',P&&P.bf!=null?delta(L.bf-P.bf,lang,true):''):'')
    +(L.fm!=null?tile(X.fm,nf(L.fm,lang),'kg',P&&P.fm!=null?delta(L.fm-P.fm,lang,true):''):'')
    +(L.lbm!=null?tile(X.lbm,nf(L.lbm,lang),'kg',P&&P.lbm!=null?delta(L.lbm-P.lbm,lang,false):''):'')
    +'</div>';
  if(P) h+='<div style="font-size:.74rem;color:var(--faint);margin:-6px 4px 12px">± '+esc(X.vs)+' '+esc(fmtD(P.d))+'</div>';
  { const ag=-daysTo(L.d); if(ag>56&&X.oldNote) h+='<div class="oldbox">⏳ '+esc(X.oldNote.replace('{n}',Math.floor(ag/7)))+'</div>'; }

  if(L.bf!=null){
    const lp=Math.round(100-L.bf);
    h+='<div class="card"><h2>'+esc(X.comp)+'</h2><div class="bar"><span class="ln" style="width:'+lp+'%"></span><span class="ft" style="width:'+(100-lp)+'%"></span></div>'
      +'<div class="lg"><span><i style="background:var(--lean)"></i>'+esc(X.lean)+' '+lp+'%</span><span><i style="background:var(--fat)"></i>'+esc(X.fat)+' '+(100-lp)+'%</span></div></div>';
  }

  if(M.length>1){
    h+='<div class="card"><h2>'+esc(X.trend)+'</h2>'+chartSvg(M,lang)
      +'<div class="scroll" style="margin-top:8px"><table><thead><tr><th>'+esc(X.date)+'</th><th>'+esc(X.w)+'</th>'+(L.bf!=null?'<th>'+esc(X.bf)+'</th><th>'+esc(X.fm)+'</th><th>'+esc(X.lbm)+'</th>':'')+'</tr></thead><tbody>'
      +M.slice().reverse().map(m=>'<tr><td>'+esc(fmtD(m.d))+'</td><td>'+nf(m.w,lang)+'</td>'+(L.bf!=null?'<td>'+(m.bf!=null?nf(m.bf,lang)+'%':'—')+'</td><td>'+nf(m.fm,lang)+'</td><td>'+nf(m.lbm,lang)+'</td>':'')+'</tr>').join('')
      +'</tbody></table></div></div>';
  }

  if(s.sf&&s.sf.sites&&s.sf.sites.length){
    const hasPrev=s.sf.sites.some(x=>x.prev!=null);
    h+='<div class="card"><h2>'+esc(X.sf)+' <span style="font-weight:400;color:var(--faint);font-size:.78rem">· '+esc(s.sf.proto)+'</span></h2><div class="scroll"><table><thead><tr><th>'+esc(X.site)+'</th>'+(hasPrev?'<th>'+esc(X.prev)+'</th>':'')+'<th>'+esc(X.now)+' (mm)</th>'+(hasPrev?'<th>Δ</th>':'')+'</tr></thead><tbody>'
      +s.sf.sites.map(x=>'<tr><td>'+esc(x.lbl)+'</td>'+(hasPrev?'<td>'+nf(x.prev,lang)+'</td>':'')+'<td>'+nf(x.mm,lang)+'</td>'+(hasPrev?'<td>'+(x.prev!=null?delta(x.mm-x.prev,lang,true):'')+'</td>':'')+'</tr>').join('')
      +'</tbody></table></div></div>';
  }

  if(s.comp){
    const k=s.comp, dd=daysTo(k.date), cl=k.cls;
    const box=(l,v,st)=>'<div class="tile"><div class="l">'+esc(l)+'</div><div class="v" style="font-size:1.05rem'+(st?';'+st:'')+'">'+v+'</div></div>';
    const lc={in:'var(--good)',ok:'var(--good)',warn:'#b26a00',bad:'var(--bad)'}[k.level]||'var(--muted)';
    h+='<div class="card" style="border-color:'+lc+'"><h2>'+esc(X.compH)+'</h2><div class="ph">'+esc(k.name||'')+'</div>'
      +'<div class="phs">'+esc(fmtD(k.date))+' · '+esc(dd===0?X.today:X.inDays.replace('{n}',dd))+(k.weighDate&&k.weighDate!==k.date?' · '+esc(X.weigh)+' '+esc(fmtD(k.weighDate)):'')+'</div>'
      +(cl?'<div class="tiles" style="margin:10px 0 6px">'+box(X.cls,'−'+nf(cl,lang)+' kg')+(k.cur!=null?box(X.cur,nf(k.cur,lang)+' kg'):'')
        +(k.dist!=null?box(X.dist,k.dist>0?nf(k.dist,lang)+' kg':esc(X.inCls),'color:'+lc):'')+(k.dist>0&&k.needWk!=null?box(X.need,nf(Math.round(k.needWk*10)/10,lang)+' '+esc(X.perWk)):'')+'</div>'
        +(k.level?'<div style="font-size:.86rem;color:'+lc+';font-weight:600">'+esc(X.lvl[k.level]||'')+'</div>':'')
        +(k.minor&&k.dist>0?'<div style="font-size:.82rem;color:var(--muted);margin-top:4px">'+esc(X.minorNote)+'</div>':''):'')
      +'</div>';
  }
  if(s.phase){
    const ph=s.phase;
    h+='<div class="card"><h2>'+esc(X.phase)+'</h2><div class="ph">'+esc(X.phases[ph.key]||X.phases.custom)+'</div>'
      +'<div class="phs">~'+esc(String(ph.kcal).replace(/\B(?=(\d{3})+(?!\d))/g,lang==='en'?',':'.'))+' '+esc(X.kcal)
      +(ph.protGkg?' · '+esc(X.prot)+' '+nf(ph.protGkg,lang)+' g/kg (~'+ph.protG+' g)':'')+'</div></div>';
  }

  // Τι σημαίνει για την προπόνηση — από τα νούμερα (πρώτη → τελευταία) + τη φάση
  const ins=[];
  if(M.length===1) ins.push(X.first);
  else if(F.lbm!=null&&L.lbm!=null){
    const dF=Math.round((L.fm-F.fm)*10)/10, dL=Math.round((L.lbm-F.lbm)*10)/10;
    if(dF<=-0.3&&dL>=-0.3) ins.push(fill(X.ins.keep,{fm:'−'+nf(Math.abs(dF),lang)}));
    else if(dF>=0.5) ins.push(fill(X.ins.fmUp,{v:nf(dF,lang)}));
    if(dL<=-0.6) ins.push(fill(X.ins.lbmDown,{v:nf(Math.abs(dL),lang)}));
    else if(dL>=0.5) ins.push(fill(X.ins.lbmUp,{v:nf(dL,lang)}));
    const wk=(new Date(L.d)-new Date(F.d))/604800000;
    if(wk>=1.5&&Math.abs(dF)>=0.3){ const r=Math.round(dF/wk*100)/100; ins.push(fill(X.ins.rate,{v:(r>0?'+':'−')+nf(Math.abs(r),lang),w:Math.round(wk)})); }
  }
  if(s.phase&&X.phaseTip[s.phase.key]) ins.push(X.phaseTip[s.phase.key]);
  if(ins.length) h+='<div class="card tip"><h2>'+esc(X.mean)+'</h2><ul>'+ins.map(t=>'<li>'+esc(t)+'</li>').join('')+'</ul></div>';

  if(s.note) h+='<div class="note">'+esc(s.note)+'<span class="by">— '+esc(s.from||'')+'</span></div>';

  const wa=String(s.wa||'').replace(/[^0-9]/g,'');
  h+='<div class="acts">'+(wa?'<a class="btn wa" target="_blank" rel="noopener" href="https://wa.me/'+esc(wa)+'">'+esc(X.reply)+'</a>':'')
    +'<button class="btn" onclick="window.print()">'+esc(X.print)+'</button></div>';
  h+='<div class="foot">'+esc(X.consent)+(s._exp?'<br>'+esc(X.valid)+' '+esc(fmtD(String(s._exp).slice(0,10))):'')+'</div>';
  el('root').innerHTML=h;
}
</script>
