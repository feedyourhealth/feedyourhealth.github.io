<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#025857">
<title>Feed Your Health — Το πλάνο μου</title>
<!-- PWA / add-to-home-screen -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Το πλάνο μου">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%23025857'/%3E%3Ctext x='90' y='118' font-family='Georgia,serif' font-size='84' font-weight='700' fill='%23E2EEE5' text-anchor='middle'%3EFY%3C/text%3E%3C/svg%3E">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%23025857'/%3E%3Ctext x='90' y='120' font-family='Georgia,serif' font-size='86' font-weight='700' fill='%23E2EEE5' text-anchor='middle'%3EFY%3C/text%3E%3C/svg%3E">
<script src="vendor/supabase-js.min.js"></script>
<style>
  :root{
    --teal:#025857; --teal-d:#014545; --teal-l:#037070;
    --tint:#E2EEE5; --tint2:#E8F5E9; --bord:#c5ddd8; --bord-l:#eef4f2;
    --ink:#1a3330; --muted:#4a7972; --faint:#6d8f89; --ok:#2e7d32;
    --bg:#f4f8f6; --card:#ffffff; --nav-bg:#fafdfc;
    --danger:#b71c1c; --danger-tint:#fbeaea; --on-danger-tint:#8a2020;
  }
  /* Σκοτεινή λειτουργία — ακολουθεί τη ρύθμιση της συσκευής. Το print παραμένει πάντα λευκό (δικό του @media). */
  @media (prefers-color-scheme: dark){
    :root{
      /* --teal-d was missing here — it stayed the light-mode #014545 (near-black) while its
         background partners (--tint2/--card) turned dark, so titles/values using --teal-d on
         those backgrounds were nearly invisible (dark-on-dark). Found testing plan.html on a
         phone with system dark mode on. */
      --teal-d:#8fe0d4;
      /* --teal itself has the same problem in its role as an ACCENT/text/icon color (streak
         count, quantity text, links, brand-logo badge, etc. — all sit on --card/--tint2/--bg)
         — measured contrast ~2.0:1 against dark card background, well under the ~3-4.5:1
         WCAG minimum. --teal is ALSO used as a solid fill behind white text (header, FAB,
         filled buttons/pills) where the light-mode value already reads fine; brightening it
         here is a deliberate compromise that keeps white-on-teal comfortably legible
         (contrast ~3.9-8:1 measured) while fixing the accent/text usages. */
      --teal:#1a8f8a;
      --teal-l:#1a8f8a;
      --tint:#152722; --tint2:#16302a; --bord:#283b36; --bord-l:#1f2f2a;
      --ink:#e7f2ef; --muted:#8fb6af; --faint:#6f948d; --ok:#4caf50;
      --bg:#0d1614; --card:#131f1c; --nav-bg:#131f1c;
      /* .excl-card/.excl-chip (exclusions/allergies notice) and .log-inp/.prog (below) all had
         hardcoded #fff/light literals instead of vars, so they stayed stuck light — or in
         .log-inp's case, its --ink text (already dark-mode-aware) landed on a hardcoded white
         background, measuring ~1.1:1 contrast (the client's own typed weight/note was nearly
         invisible). Same root cause as --teal-d/--teal/--nav-bg above, found by grepping for
         every remaining hardcoded color once that pattern was known. */
      --danger:#ff8a80; --danger-tint:#3a1f1f; --on-danger-tint:#ffb4a8;
    }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.5}
  #app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);display:flex;flex-direction:column;position:relative}

  .hdr{background:var(--teal);color:#fff;padding:18px 18px 16px;position:sticky;top:0;z-index:20}
  .hdr-top{display:flex;align-items:center;justify-content:space-between}
  .brand{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--tint);letter-spacing:.3px}
  .brand-logo{width:26px;height:26px;border-radius:50%;background:var(--tint);display:flex;align-items:center;justify-content:center;color:var(--teal);font-weight:700;font-size:14px}
  .hdr h1{font-size:21px;font-weight:600;margin:12px 0 2px}
  .hdr .sub{font-size:13px;color:#9fcabf}

  .scroll{flex:1;overflow-y:auto;padding:14px 14px calc(90px + env(safe-area-inset-bottom))}
  .view{display:none;flex-direction:column;gap:12px}
  .view.active{display:flex}

  .card{background:var(--card);border:.5px solid var(--bord);border-radius:14px;overflow:hidden}
  .card-pad{padding:12px 14px}
  .card-hdr{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--teal-d);margin-bottom:10px}
  .card-hdr i,.ic{color:var(--teal)}

  .stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
  .stats-4{grid-template-columns:1fr 1fr 1fr 1fr}
  .stat{background:var(--tint2);border-radius:12px;padding:10px 6px;text-align:center}
  .stat .l{font-size:12px;color:var(--teal-l)}
  .stat .v{font-size:18px;font-weight:600;color:var(--teal-d)}
  .stat .u{font-size:11px;color:var(--muted)}
  /* Δαχτυλίδι προόδου προς τον στόχο βάρους — ίδιο component/τεχνική (conic-gradient + mask) με το
     αντίστοιχο .pct-ring του Dietologist.html (css/styles.css), αλλά ξαναφτιαγμένο εδώ με τα δικά
     του tokens γιατί το plan.html είναι εντελώς ξεχωριστό αρχείο/deployment (client portal), χωρίς
     πρόσβαση σε εκείνο το stylesheet. Βλ. goalRingHtml() πιο κάτω. */
  .pct-ring{display:inline-grid;place-items:center;width:var(--pr-size,84px);height:var(--pr-size,84px);flex-shrink:0}
  .pct-ring::before{content:"";grid-area:1/1;width:100%;height:100%;border-radius:50%;
    background:conic-gradient(var(--teal) var(--pr-p,0%), var(--tint2) 0);
    -webkit-mask:radial-gradient(farthest-side, transparent calc(100% - var(--pr-thick,9px)), #000 calc(100% - var(--pr-thick,9px)));
    mask:radial-gradient(farthest-side, transparent calc(100% - var(--pr-thick,9px)), #000 calc(100% - var(--pr-thick,9px)));}
  .pct-ring-label{grid-area:1/1;font-weight:700;color:var(--teal-d);line-height:1.15;text-align:center}
  .goalring-card{display:flex;align-items:center;gap:14px;padding:14px}
  .goalring-card .txt .t{font-size:13px;font-weight:600;color:var(--ink)}
  .goalring-card .txt .s{font-size:12px;color:var(--muted);margin-top:2px}
  .stat .u.ok{color:var(--ok)}

  .meal{display:flex;gap:10px;padding:9px 0;border-bottom:.5px solid var(--bord-l)}
  .meal:last-child{border-bottom:none}
  .meal .t{font-size:12px;color:var(--faint);width:42px;flex-shrink:0;padding-top:1px}
  .meal .nm{font-size:14px;color:var(--ink)}
  .meal .mi{font-size:12px;color:var(--muted)}
  .meal .mc{width:23px;height:23px;border:1.5px solid var(--bord);border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;cursor:pointer;transition:transform .1s;margin-top:1px}
  .meal .mc:active{transform:scale(.85)}
  .meal.eaten .mc{background:var(--teal);border-color:var(--teal)}
  .meal.eaten .nm{color:var(--faint);text-decoration:line-through}
  /* check-off στο tab Πλάνο (σήμερα ή παλαιότερα) — ίδιο ύφος με το .meal .mc της Αρχικής */
  .pm-chk{width:23px;height:23px;border:1.5px solid var(--bord);border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;cursor:pointer;transition:transform .1s}
  .pm-chk:active{transform:scale(.85)}
  .pm-chk.on{background:var(--teal);border-color:var(--teal)}
  .card.eaten-meal{opacity:.65}
  .food{display:flex;justify-content:space-between;padding:8px 0;border-bottom:.5px solid var(--bord-l);font-size:13px}
  .food:last-child{border-bottom:none}
  .food .q{font-weight:600;color:var(--teal)}

  .swap-btn{width:100%;display:flex;align-items:center;justify-content:space-between;background:none;border:.5px solid var(--bord);border-radius:10px;padding:8px 12px;font-size:13px;color:var(--teal);margin-top:8px;cursor:pointer;font-family:inherit}
  .swap-btn i{font-size:16px;transition:transform .15s}
  .swap-btn.open i.chev{transform:rotate(180deg)}
  .swap-list{display:none;flex-direction:column;gap:8px;margin-top:8px}
  .swap-list.open{display:flex}
  .swap-item{display:flex;flex-direction:column;gap:1px;padding:8px 10px;background:var(--tint2);border-radius:10px}
  .swap-item .nm{font-size:13px;font-weight:600;color:var(--teal-d)}
  .swap-item .fd{font-size:12px;color:var(--muted)}
  .swap-note{font-size:11px;color:var(--faint);margin-top:8px}

  .log-inp{width:100%;border:.5px solid var(--bord);border-radius:10px;padding:9px 11px;font-size:16px;font-family:inherit;color:var(--ink);background:var(--card);box-sizing:border-box}
  .log-inp:focus{outline:none;border-color:var(--teal-l)}
  textarea.log-inp{resize:vertical;min-height:54px}
  .log-sent{font-size:12px;color:var(--ok);display:flex;align-items:center;gap:6px;margin-bottom:8px}
  .log-warn{font-size:12px;color:#c77d11;display:flex;align-items:center;gap:6px;margin-bottom:8px;flex-wrap:wrap}
  .log-warn button{background:none;border:none;color:#c77d11;font-weight:700;text-decoration:underline;cursor:pointer;font-size:12px;padding:0;font-family:inherit}
  .log-err{font-size:12px;color:#c0392b;margin:6px 0 8px;display:none}
  .log-err.show{display:block}
  .log-tag-label{font-size:11px;color:var(--muted);margin:8px 0 6px}
  .log-tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
  .log-tag{border:.5px solid var(--bord);background:var(--card);color:var(--muted);border-radius:999px;padding:6px 11px;font-size:12px;display:flex;align-items:center;gap:5px;cursor:pointer;font-family:inherit}
  .log-tag i{font-size:14px}
  .log-tag-on{background:var(--tint2);border-color:var(--teal-l);color:var(--teal-d)}
  .log-tag-badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:3px 8px;border-radius:999px;background:var(--tint2);color:var(--teal-d);white-space:nowrap}

  /* «Στείλε ένα μήνυμα» στην Αρχική — μαζεμένο μέχρι να το πατήσεις, ώστε να μη βαραίνει οπτικά
     την Αρχική όταν δεν χρειάζεται. Ίδιο .log-inp/.log-tags/.swap-btn με την Πρόοδο, ώστε μήνυμα
     και καταγραφή βάρους να μοιάζουν σαν μέρος του ίδιου συστήματος παρόλο που είναι πια χωριστά. */
  .composer{background:var(--card);border:.5px solid var(--bord);border-radius:14px}
  .composer .row{display:flex;align-items:center;gap:9px;padding:11px 13px;cursor:pointer}
  .composer .row i{font-size:18px;color:var(--teal);flex-shrink:0}
  .composer .row span{font-size:12.5px;color:var(--muted);flex:1}
  .composer .row .chev{font-size:13px;color:var(--faint);transition:transform .15s;flex:0 0 auto}
  .composer.open .row .chev{transform:rotate(90deg)}
  .composer .expand{max-height:0;overflow:hidden;transition:max-height .22s ease}
  .composer.open .expand{max-height:280px}
  .composer .expand-in{padding:0 13px 12px}

  .milestone{display:flex;align-items:center;gap:12px;background:var(--tint2);border-radius:14px;padding:12px}
  .milestone i{font-size:26px;color:var(--teal)}
  .mtitle{font-size:14px;font-weight:600;color:var(--teal-d)}
  .msub{font-size:12px;color:var(--muted);margin-top:2px}
  .mstrip{display:flex;gap:8px;margin-top:12px}
  .mbadge{flex:1;text-align:center;padding:8px 4px;border-radius:10px;border:.5px solid var(--bord)}
  .mbadge.done{background:var(--tint2);border-color:var(--teal-l)}
  .mbadge i{font-size:17px;color:var(--muted)}
  .mbadge.done i{color:var(--teal)}
  .mbadge .n{font-size:10px;color:var(--muted);margin-top:3px}
  .mbadge.done .n{color:var(--teal-d);font-weight:600}
  .sharebtn{width:100%;background:none;border:.5px solid var(--bord);border-radius:10px;padding:9px;font-size:13px;font-weight:500;font-family:inherit;color:var(--teal);display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;margin-top:12px}
  .goalhero{background:var(--teal);color:#fff;border-radius:16px;padding:18px;margin-bottom:14px}
  .goalhero .lbl{font-size:11px;opacity:.85;text-transform:uppercase;letter-spacing:.4px}
  .goalhero .val{font-size:26px;font-weight:700;margin:4px 0}
  .goalhero .arrow{display:flex;align-items:center;gap:6px;font-size:12px;opacity:.9}
  .obicon{font-size:40px;color:var(--teal);display:block;text-align:center;margin-bottom:10px}
  .obtitle{font-size:16px;font-weight:600;color:var(--teal-d);text-align:center;margin:0 0 6px}
  .obsub{font-size:12px;color:var(--muted);text-align:center;line-height:1.6;margin-bottom:14px}
  .obdots{display:flex;gap:6px;justify-content:center;margin-bottom:16px}
  .obdot{width:6px;height:6px;border-radius:50%;background:var(--bord)}
  .obdot.on{background:var(--teal);width:16px;border-radius:3px}
  .obskip{text-align:center;font-size:12px;color:var(--muted);margin-top:10px;cursor:pointer}

  .water{background:var(--tint);border-radius:14px;padding:12px 14px}
  .glasses{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
  .glass{width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;color:var(--faint);cursor:pointer;transition:transform .1s}
  .glass.on{color:var(--teal)}
  .glass:active{transform:scale(.85)}

  .quick{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
  .quick .card-pad{cursor:pointer;padding:10px 8px}
  .quick .qt{font-size:12.5px;font-weight:600;color:var(--teal-d);margin-top:6px;line-height:1.25}
  .quick .qs{font-size:11px;color:var(--muted)}

  .daypills{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;-webkit-overflow-scrolling:touch}
  .daypills::-webkit-scrollbar{display:none}
  .pill{flex:0 0 auto;padding:7px 13px;border-radius:999px;background:var(--card);border:.5px solid var(--bord);font-size:12px;color:var(--muted);cursor:pointer}
  .pill.on{background:var(--teal);color:#fff;border-color:var(--teal)}

  .slcat{margin-bottom:12px}
  .slcat-h{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin-bottom:6px}
  /* flex-wrap:wrap + .nm flex-basis:auto + .amt margin-left:auto — audit finding 2026-08-22: σε
     ru/tr πελάτες, ένα κονσέρβα/ξηρό είδος (μακρύ .raw label, π.χ. "консерв. (без жидк.)")
     δίπλα σε μακρύ όνομα συνταγής στρίμωχνε το .nm σε 4 στενές γραμμές (141px, ζωντανά
     μετρημένο) — τίποτα δεν έκοβε/ξεχείλιζε, απλά δυσανάγνωστο. Πρώτη προσπάθεια με
     flex-wrap:wrap + min-width δεν αρκούσε: το .nm{flex:1} = flex-basis:0%, και με
     flex-basis:0% ο browser υπολογίζει «χωράει σε 1 γραμμή» με το .nm σαν να συνεισφέρει 0px
     στον υπολογισμό, οπότε ΠΟΤΕ δεν πυροδοτούνταν πραγματικό line-break — το .amt απλά
     κεντραρόταν κάθετα δίπλα σε ένα ήδη 4-γραμμο .nm, ζωντανά επιβεβαιωμένο identical πριν/μετά.
     Το flex-basis:auto (αντί για flex:1 shorthand) δίνει στο .nm πραγματικό content-based μέγεθος
     για τον υπολογισμό, οπότε το .amt πλέον όντως πέφτει σε δική του γραμμή όταν δεν χωράει —
     ζωντανά επιβεβαιωμένο: .nm 1 γραμμή αντί για 4, .amt δεξιά ευθυγραμμισμένο στη γραμμή του.
     Δεν αλλάζει τίποτα στην κοινή περίπτωση (όλα χωράνε σε 1 γραμμή, όπως πάντα). */
  .slrow{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:7px 0;border-bottom:.5px solid var(--bord-l);cursor:pointer}
  .slrow:last-child{border-bottom:none}
  .slrow .chk{width:20px;height:20px;border:1.5px solid var(--bord);border-radius:5px;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px}
  .slrow.done .chk{background:var(--teal);border-color:var(--teal)}
  .slrow.done .nm{color:var(--faint);text-decoration:line-through}
  .slrow .nm{flex:1 1 auto;min-width:140px;font-size:13px}
  .slrow .amt{margin-left:auto;font-size:12px;color:var(--teal);font-weight:600;text-align:right}
  .slrow .amt .raw{color:var(--muted);font-weight:400;font-size:11px}
  .fxrow{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:.5px solid var(--bord-l)}
  .fxrow:last-child{border-bottom:none}
  .fxname{font-size:13px;font-weight:600;color:var(--teal-d)}
  .fxpor{font-size:11px;color:var(--muted);margin-top:1px}
  .fxr{text-align:right;font-size:12px;color:var(--muted)}
  .fxg{color:var(--ink);font-weight:600}

  .prog{height:6px;background:var(--card);border-radius:999px;margin-top:10px;overflow:hidden}
  .prog>div{height:100%;background:var(--teal);transition:width .25s}

  /* updated badge in header */
  .upd{display:inline-flex;align-items:center;gap:5px;margin-top:8px;font-size:11px;color:#9fcabf;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);padding:3px 9px;border-radius:999px}
  .upd i{font-size:13px}

  /* personal note from the dietitian */
  .note-coach{background:linear-gradient(135deg,var(--tint2),var(--card));border:.5px solid var(--bord);border-left:3px solid var(--teal);border-radius:14px;padding:12px 14px}
  .note-coach .nh{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:700;color:var(--teal-d);margin-bottom:5px}
  .note-coach .nb{font-size:13.5px;color:var(--ink);line-height:1.55;white-space:pre-wrap}

  /* small legend line */
  .legend{font-size:11px;color:var(--faint);padding:2px 2px 0;line-height:1.4}

  /* dismissible inline notice — shared by the install-app banner and the "no activity yet" nudge */
  .inline-notice{display:flex;align-items:flex-start;gap:10px;background:var(--tint2);border:.5px solid var(--bord);border-radius:14px;padding:12px 34px 12px 14px;position:relative}
  .inline-notice .in-ic{color:var(--teal);font-size:18px;flex-shrink:0;margin-top:1px}
  .inline-notice .in-txt{flex:1;min-width:0}
  .inline-notice .in-t{font-size:13px;font-weight:700;color:var(--teal-d);margin-bottom:2px}
  .inline-notice .in-s{font-size:12px;color:var(--muted);line-height:1.45}
  .inline-notice .in-btn{background:var(--teal);color:#fff;border:none;border-radius:9px;font-size:12.5px;font-weight:700;padding:7px 12px;margin-top:8px;font-family:inherit;cursor:pointer}
  .inline-notice .in-x{position:absolute;top:8px;right:8px;width:24px;height:24px;border:none;background:none;color:var(--faint);font-size:15px;display:flex;align-items:center;justify-content:center;border-radius:50%;cursor:pointer}
  .inline-notice .in-x:active{background:var(--bord-l)}

  /* streak-freeze chip on the milestone card */
  .freeze-chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;color:var(--teal-d);background:var(--tint);padding:5px 10px;border-radius:999px;margin-top:10px}
  .freeze-chip.used{color:var(--faint);background:var(--bord-l)}

  /* exclusions/allergies the plan already avoids — surfaced so the client can confirm it, not just trust it */
  /* 🥤 CHO Training Protocol card (Phase 3) — plan.html renders SNAP.days[i].cho, server-baked. */
  .cho-card{background:var(--card);border:.5px solid var(--bord);border-radius:14px;padding:14px;margin-bottom:12px}
  .cho-card .ch-hd{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--teal-d);margin-bottom:2px}
  .cho-card .ch-sub{font-size:12px;color:var(--muted);margin-bottom:12px}
  .cho3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}

// Μόνιμος κανόνας: SNAP.days[i].isMatch/.matchTime (ίδιο μοτίβο με isTrain), τον ορίζει
// ο διαιτολόγος μία φορά. Το override παρακάτω είναι μόνο εξαίρεση για ΤΗΝ τρέχουσα
// εβδομάδα (π.χ. μετατέθηκε ο αγώνας) — δεν αγγίζει ποτέ τον μόνιμο κανόνα.
const DAY_LABELS=['Δευτέρα','Τρίτη','Τετάρτη','Πέμπτη','Παρασκευή','Σάββατο','Κυριακή'];
const MATCH_TIMES=['πρωί','μεσημέρι','απόγευμα','βράδυ'];
const MATCH_TIME_H={'πρωί':9,'μεσημέρι':13,'απόγευμα':17,'βράδυ':20};
// Το SNAP.days[i].label είναι ήδη στη σωστή γλώσσα (server-baked στο _buildSnapshot) — προτιμάται
// από το τοπικό DAY_LABELS (πάντα ελληνικά) όπου δείχνουμε πλήρες όνομα ημέρας στον πελάτη.
function dayFullName(i){return (SNAP&&SNAP.days&&SNAP.days[i]&&SNAP.days[i].label)||DAY_LABELS[i]}
// Display-only translation of the match-time bucket. Οι ίδιες οι ελληνικές λέξεις ('πρωί' κτλ) πρέπει
// να παραμείνουν αναλλοίωτες ως ΤΙΜΕΣ (MATCH_TIMES/MATCH_TIME_H keys, localStorage, ov.time) — αυτό
// εδώ μεταφράζει μόνο ό,τι φαίνεται στην οθόνη του πελάτη.
const MATCH_TIME_KEYS={'πρωί':'mtMorning','μεσημέρι':'mtNoon','απόγευμα':'mtAfternoon','βράδυ':'mtEvening'};
function matchTimeLabel(t){return T(MATCH_TIME_KEYS[t]||'mtAfternoon')}
function curWeekKey(){return dKey(weekDates()[0])}
function getMatchOverride(){try{const o=JSON.parse(localStorage.getItem(lk('matchOverride'))||'{}');return o.week===curWeekKey()?o:null}catch(e){return null}}
function setMatchOverride(dayIdx,time){try{localStorage.setItem(lk('matchOverride'),JSON.stringify({week:curWeekKey(),day:dayIdx,time:time}))}catch(e){}}
function defaultMatchDay(){const days=(SNAP&&SNAP.days)||[];for(let i=0;i<days.length;i++){if(days[i]&&days[i].isMatch)return i;}return -1}
function defaultMatchTime(){const i=defaultMatchDay();return (i>=0&&SNAP.days[i].matchTime)||'απόγευμα'}
function isCurWeekDate(d){const mon=weekDates()[0],sun=weekDates()[6];const dd=new Date(d);dd.setHours(12,0,0,0);return dd>=mon&&dd<=sun}
// effective match state για συγκεκριμένο day index, λαμβάνοντας υπόψη το override της εβδομάδας.
// forDate προαιρετικό — όταν δίνεται (π.χ. σε ιστορικά στατιστικά για streak/σκορ), το override
// εφαρμόζεται ΜΟΝΟ αν η ημερομηνία πέφτει μέσα στην τρέχουσα εβδομάδα, αλλιώς θα "διέρρεε" αναδρομικά
// σε προηγούμενες εβδομάδες (π.χ. αν φέτος μετακινήθηκε ο αγώνας, δεν πρέπει να αλλάξει το ιστορικό).
function matchInfoFor(dayIdx,forDate){
  const ov=getMatchOverride();
  if(ov && (forDate===undefined||isCurWeekDate(forDate)))return ov.day===dayIdx?{isMatch:true,time:ov.time}:{isMatch:false};
  const d=(SNAP&&SNAP.days&&SNAP.days[dayIdx])||null;
  return (d&&d.isMatch)?{isMatch:true,time:d.matchTime||'απόγευμα'}:{isMatch:false};
}
// "πριν"/"μετά" τον αγώνα, υπολογισμένο από την ήδη υπάρχουσα ώρα του γεύματος (m.time) σε σχέση
// με το χοντρικό διάστημα του αγώνα — όχι νέο περιεχόμενο γεύματος, μόνο ετικέτα.
function matchRelTag(mealTime,bucket){
  if(!mealTime)return '';
  const hh=parseInt(String(mealTime).split(':')[0],10); if(isNaN(hh))return '';
  const bh=MATCH_TIME_H[bucket]||17;
  return hh<bh?T('beforeMatch'):(hh>bh?T('afterMatch'):'');
}
// Συμπτυγμένο by default — μία γραμμή επιβεβαίωσης, ώστε να μην καταλαμβάνει την Αρχική τις

function matchCard(){
  if(!SNAP)return null;

  if(defDay<0 && !ov)return null;
  const curDayIdx=ov?ov.day:defDay;

    +'<span style="font-size:13px;color:var(--muted);flex:1">'+T('matchLabel')+': '+esc(summary)+(ov?' <span style="color:var(--faint);font-size:11px">'+T('matchThisWeek')+'</span>':'')+'</span>';
  const toggleBtn=el('button','swap-btn',matchCardOpen?T('matchCloseBtn'):T('matchChange'));
  toggleBtn.type='button';
  toggleBtn.style.cssText='width:auto;margin-top:0;padding:5px 10px;font-size:11px;flex-shrink:0';
  toggleBtn.onclick=()=>{matchCardOpen=!matchCardOpen;go('home')};
  head.appendChild(toggleBtn);
  cp.appendChild(head);
  if(matchCardOpen){
    const body=el('div',null); body.style.cssText='margin-top:10px;padding-top:10px;border-top:.5px solid var(--bord-l)';
    const dayRow=el('div',null); dayRow.style.cssText='display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px';
    const DOW_KEYS=['dayMon','dayTue','dayWed','dayThu','dayFri','daySat','daySun'];
    DAY_LABELS.forEach((lbl,idx)=>{
      const p=el('button','log-tag'+(curDayIdx===idx?' log-tag-on':''),T(DOW_KEYS[idx])); p.type='button';
      p.onclick=()=>{setMatchOverride(idx,curTime||'απόγευμα');go('home')};
      dayRow.appendChild(p);
    });
    const offP=el('button','log-tag'+(curDayIdx<0?' log-tag-on':''),T('matchOff')); offP.type='button';
    offP.onclick=()=>{setMatchOverride(-1,null);go('home')};
    dayRow.appendChild(offP);
    body.appendChild(dayRow);
    const timeRow=el('div',null); timeRow.style.cssText='display:flex;flex-wrap:wrap;gap:6px';
    MATCH_TIMES.forEach(t=>{
      const p=el('button','log-tag'+(curTime===t?' log-tag-on':''),matchTimeLabel(t)); p.type='button';
      p.onclick=()=>{if(curDayIdx>=0){setMatchOverride(curDayIdx,t);go('home')}};
      timeRow.appendChild(p);
    });
    body.appendChild(timeRow);
    if(ov){
      const note=defDay>=0?T('matchDefaultNote',{day:dayFullName(defDay)}):T('matchOverrideNote');
      body.appendChild(el('div','swap-note',note));
    }
    cp.appendChild(body);
  }
  c.appendChild(cp);
  return c;
}

function getClientLog(){try{return JSON.parse(localStorage.getItem(lk('clientlog'))||'{}')}catch(e){return {}}}
function getClientLogToday(){return getClientLog()[todayKey()]||null}
// Η κάρτα στόχου δείχνεται ΜΙΑ φορά συνολικά ανά link (όχι ανά επίσκεψη) — μόλις εμφανιστεί σημειώνεται ως "seen".

function dKey(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function weekDates(){ // Δευτέρα → Κυριακή της τρέχουσας εβδομάδας
  const now=new Date(); const js=now.getDay(); const toMon=(js===0?-6:1-js);
  const mon=new Date(now); mon.setDate(now.getDate()+toMon); mon.setHours(0,0,0,0);
  const arr=[]; for(let i=0;i<7;i++){const d=new Date(mon);d.setDate(mon.getDate()+i);arr.push(d);} return arr;
}
// Στέλνει σήμερα's σύνοψη adherence στο Supabase (checkins table) ώστε ο διαιτολόγος να τη δει.
// Best-effort: αν αποτύχει (offline κτλ) δεν πειράζει, τα localStorage δεδομένα μένουν πάντα η πηγή αλήθειας.
// ✅ Debounced (400ms): ένα γεύμα/ποτήρι/συμπλήρωμα-tap καλεί pushCheckin() συγχρονισμένα από το δικό
// του onclick, οπότε 2 γρήγορα διαδοχικά taps (π.χ. 2 συμπληρώματα) παλιά έστελναν 2 ανεξάρτητα
// RPC calls ταυτόχρονα — race condition όπου το αίτημα με το ΠΑΛΙΟΤΕΡΟ (μικρότερο) σύνολο μπορούσε να
// απαντήσει ΤΕΛΕΥΤΑΙΟ στον server και να «κερδίσει» το upsert, αφήνοντας τον διαιτολόγο να βλέπει π.χ.
// 1/2 συμπληρώματα ενώ ο πελάτης πραγματικά είχε κάνει 2/2. Το debounce μαζεύει διαδοχικά taps σε ΕΝΑ
// αίτημα που διαβάζει το localStorage στο τέλος (πάντα το πιο πρόσφατο σύνολο), οπότε δεν υπάρχουν πια
// 2 ταυτόχρονα αιτήματα να παίξουν κούρσα μεταξύ τους.
let _pushCheckinTimer=null;
function pushCheckin(){
  if(_pushCheckinTimer)clearTimeout(_pushCheckinTimer);
  _pushCheckinTimer=setTimeout(_pushCheckinNow,400);
}
function _pushCheckinNow(){
  _pushCheckinTimer=null;
  if(!sb || !SNAP)return;
  const tok=token(); if(!tok)return;
  try{
    const pd=planForDate(new Date()); if(!pd)return;
    const s=SNAP, h=s.hydration||{}, per=h.glassMl||250;
    const mealsN=(pd.meals||[]).length;
    const eaten=getMeals(); let mDone=0; for(let j=0;j<mealsN;j++)if(eaten[j])mDone++;
    const supCount=(s.supps||[]).length;
    const todK=dKey(new Date());
    const suppDay=(getSuppLog()[todK])||{};
    let sDone=0; (s.supps||[]).forEach(su=>{if(suppDay[su.name])sDone++;});
    const mi=matchInfoFor(defaultDay());
    const goalMl=(mi.isMatch&&h.matchMl)?h.matchMl:(pd.isTrain&&h.trainMl)?h.trainMl:(h.baseMl||2000);
    const waterGoal=Math.max(6,Math.round(goalMl/per));
    sb.rpc('submit_checkin',{
      p_token:tok, p_date:todK,
      p_meals_done:mDone, p_meals_total:mealsN,
      p_water_glasses:getWater(), p_water_goal:waterGoal,
      p_supps_done:sDone, p_supps_total:supCount
    }).then(()=>{}).catch(()=>{});
  }catch(e){}
}
// Στέλνει αμέσως ό,τι εκκρεμεί στο debounce (π.χ. πριν κρυφτεί η σελίδα) αντί να χαθεί σιωπηλά.
function flushPushCheckin(){
  if(_pushCheckinTimer){clearTimeout(_pushCheckinTimer);_pushCheckinNow();}
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')flushPushCheckin();});

// ── «Στείλε ένα μήνυμα» (Αρχική) ─────────────────────────────────────────────
// Πριν ήταν ένα ενιαίο πεδίο κειμένου θαμμένο κάτω από το σκορ/σερί στην Πρόοδο, μαζί με το βάρος —
// ο πελάτης έπρεπε να ξέρει ότι εκεί "στέλνονται μηνύματα". Τώρα είναι πάντα ορατό στην Αρχική,
// μαζεμένο σε μια γραμμή μέχρι να το πατήσεις. Γράφει στην ΙΔΙΑ ημερήσια client_logs εγγραφή με
// το βάρος, μέσω saveClientLogPatch — βλέπε το σχόλιο εκεί για το γιατί χρειάζεται merge.
function messageComposer(){
  const already=getClientLogToday();
  const hasMsg=!!(already && (already.n || already.tag));
  const c=el('div','composer'); c.id='msgComposer';

  if(hasMsg && !editingNote){
    const tagDef=already.tag&&logTags().find(t=>t.id===already.tag);
    const tagBadge=tagDef?(' <span class="log-tag-badge"><i class="ti '+tagDef.icon+'"></i>'+tagDef.label+'</span>'):'';
    const detail=(already.n?esc(already.n):'')+tagBadge;
    c.innerHTML = already.synced===false
      ? '<div class="log-warn" style="margin:0;padding:11px 13px"><i class="ti ti-alert-triangle"></i>'+T('composerNotSent')+(detail?': '+detail:'')+' <button onclick="retryClientLogSync()">'+T('composerRetry')+'</button></div>'
      : '<div class="log-sent" style="margin:0;padding:11px 13px"><i class="ti ti-circle-check"></i><span style="flex:1">'+(detail?T('composerSentPrefix')+': '+detail:T('composerSentToday'))+'</span><button type="button" onclick="editClientNote()" style="background:none;border:none;color:var(--teal);font-weight:600;cursor:pointer;font-family:inherit;font-size:12px;flex-shrink:0">'+T('composerEdit')+'</button></div>';
    return c;
  }

  const editing=hasMsg && editingNote;
  c.className='composer'+(editing?' open':'');
  if(editing)selectedLogTag=already.tag||null;
  const prefill=editing?(already.n||''):'';
  c.innerHTML='<div class="row"'+(editing?'':' onclick="toggleMessageComposer()"')+'>'
    +'<i class="ti ti-message-circle-2"></i>'
    +'<span>'+(editing?T('composerEditing'):T('composerPrompt'))+'</span>'
    +(editing?'':'<i class="ti ti-chevron-right chev"></i>')
    +'</div>'

// πελάτης να πατήσει ξανά «Στείλε» (submitClientNote θα αντικαταστήσει το παλιό μήνυμα τότε).
function editClientNote(){ editingNote=true; go('home'); }
// Το βάρος (Πρόοδος) και το μήνυμα (Αρχική, messageComposer) στέλνονται πλέον από ξεχωριστές
// φόρμες, αλλά μοιράζονται την ΙΔΙΑ ημερήσια εγγραφή client_logs στο Supabase — το RPC αντικαθιστά
// ολόκληρη τη γραμμή σε κάθε κλήση (δεν κάνει partial update από μόνο του), οπότε ΕΔΩ κάνουμε το
// merge: ό,τι ΔΕΝ περιλαμβάνεται στο patch διατηρείται από την προηγούμενη τοπική εγγραφή, αλλιώς
// π.χ. ένα μήνυμα που στέλνεται το απόγευμα θα έσβηνε ένα βάρος που καταγράφηκε το πρωί.
function saveClientLogPatch(patch){
  const existing=getClientLogToday()||{};
  const merged=Object.assign({},existing,patch,{synced:false});
  setClientLogToday(merged);
  if(merged.w){
    SNAP.progress=SNAP.progress||{};
    const log=SNAP.progress.log=SNAP.progress.log||[];
    const idx=log.findIndex(e=>e.date===todayKey());
    if(idx>-1)log[idx]=Object.assign({},log[idx],{kg:merged.w}); else log.push({date:todayKey(),kg:merged.w});
    log.sort((a,b)=>a.date<b.date?-1:1);
    SNAP.progress.current=merged.w;
    if(!SNAP.progress.start)SNAP.progress.start=merged.w;
  }
  syncClientLog(merged.w||null, merged.n||'', merged.tag||null);
  return merged;
}
// Καταγραφή βάρους από το Πρόοδος tab (write-only, χωρίς login).
function submitWeightLog(){
  const wEl=$('#log-weight'), errEl=$('#log-err');
  if(errEl)errEl.classList.remove('show');
  const wRaw=wEl&&wEl.value?wEl.value.trim():'';
  if(!wRaw)return;
  const w=parseFloat(wRaw);
  if(!isFinite(w)||w<20||w>300){
    if(errEl){errEl.textContent=T('weightErr');errEl.classList.add('show');}
    return;
  }
  saveClientLogPatch({w:w});
  go('prog');
}
// Ελεύθερο μήνυμα από το composer της Αρχικής (write-only, χωρίς login).

  if(!n && !tag)return;
  saveClientLogPatch({n:n,tag:tag});

// Best-effort αποστολή στο Supabase. Σε αντίθεση με πριν, ΔΕΝ κρύβουμε σιωπηλά την αποτυχία —
// αν δεν περάσει (offline, session κλπ.) ο πελάτης βλέπει προειδοποίηση + κουμπί "Δοκίμασε ξανά"
// αντί να νομίζει ότι η διαιτολόγος του έλαβε κάτι που ποτέ δεν έφτασε.
// Το tag κωδικοποιείται ως πρόθεμα "[tag:id] " μέσα στο ίδιο πεδίο σημείωσης (p_note) — έτσι δεν
// χρειάζεται νέα στήλη/migration στο client_logs table, μόνο parsing στην πλευρά του διαιτολόγου.
function syncClientLog(w,n,tag){
  const tok=token(), todK=dKey(new Date());
  if(!sb||!tok)return;
  const noteToSend=((tag?'[tag:'+tag+'] ':'')+(n||'')).trim()||null;
  sb.rpc('submit_client_log',{p_token:tok,p_date:todK,p_weight_kg:w,p_note:noteToSend}).then((res)=>{
    // Το Supabase JS client ΔΕΝ κάνει reject σε HTTP 4xx/5xx — resolve με {error} μέσα.
    // Πρέπει να το ελέγξουμε ρητά, αλλιώς ένα απορριφθέν αίτημα (π.χ. άκυρο token) θα φαινόταν "εστάλη".
    const ok=!(res&&res.error);
    const e=getClientLogToday(); if(e){e.synced=ok; setClientLogToday(e);}
    if(curTab()==='prog'||curTab()==='home')go(curTab());
  }).catch(()=>{
    const e=getClientLogToday(); if(e){e.synced=false; setClientLogToday(e);}
    if(curTab()==='prog'||curTab()==='home')go(curTab());
  });
}
// Καλείται από το κουμπί "Δοκίμασε ξανά" στην προειδοποίηση μη-συγχρονισμένης καταγραφής.
function retryClientLogSync(){
  const e=getClientLogToday(); if(!e)return;
  syncClientLog(e.w,e.n,e.tag);
}

// μόνο αφού το RPC πράγματι πετύχει, ίδιο honest-by-default μοτίβο με syncClientLog/retryClientLogSync.
function submitPlanFeedback(){
  const tok=token(); if(!tok)return;
  const weekKey=pfWeekKey; if(!weekKey)return;
  const entry={
    breakfast:pfRatings.breakfast||null, snacks:pfRatings.snacks||null,
    lunch:pfRatings.lunch||null, dinner:pfRatings.dinner||null,
    recipes_ease:pfRatings.recipes_ease||null, ingredients_ease:pfRatings.ingredients_ease||null,
    training_energy:pfRatings.training_energy||null, continue_likelihood:pfNps,
    low_rating_reasons:Object.keys(pfReasons).length?pfReasons:null,
    synced:false
  };

}
function syncPlanFeedback(weekKey,entry){
  const tok=token();
  if(!sb||!tok)return;
  sb.rpc('submit_plan_feedback',{
    p_token:tok, p_week_start:weekKey,
    p_breakfast:entry.breakfast, p_snacks:entry.snacks, p_lunch:entry.lunch, p_dinner:entry.dinner,
    p_recipes_ease:entry.recipes_ease, p_ingredients_ease:entry.ingredients_ease, p_training_energy:entry.training_energy,
    p_continue_likelihood:entry.continue_likelihood, p_low_rating_reasons:entry.low_rating_reasons
  }).then((res)=>{
    // Το Supabase JS client ΔΕΝ κάνει reject σε HTTP 4xx/5xx — resolve με {error} μέσα, πρέπει να το ελέγξουμε ρητά.
    const ok=!(res&&res.error);
    const e=getPlanFeedbackEntry(weekKey); if(e){e.synced=ok; setPlanFeedbackEntry(weekKey,e);}
    if(curTab()==='prog')go('prog');
  }).catch(()=>{
    const e=getPlanFeedbackEntry(weekKey); if(e){e.synced=false; setPlanFeedbackEntry(weekKey,e);}
    if(curTab()==='prog')go('prog');
  });
}
// Καλείται από το κουμπί "Δοκίμασε ξανά" στην προειδοποίηση μη-συγχρονισμένης αξιολόγησης.
function retryPlanFeedbackSync(){
  const weekKey=pfWeekKey; if(!weekKey)return;
  const e=getPlanFeedbackEntry(weekKey); if(!e)return;
  syncPlanFeedback(weekKey,e);
}

async function boot(){
  const t=token();
  if(!t){return fail('Λείπει ο σύνδεσμος του πλάνου.','Ζήτησε από τον διαιτολόγο σου το σωστό link.','Plan link is missing.','Ask your dietitian for the correct link.')}
  try{
    sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
    const {data,error}=await sb.rpc('get_shared_plan',{p_token:t}).single();
    if(error||!data){console.error('[FYH portal] get_shared_plan:',error); return fail('Το πλάνο δεν βρέθηκε.','Μπορεί να έληξε ή να αποσύρθηκε. Ζήτησε νέο link από τον διαιτολόγο σου. Αν μόλις σου το έστειλε, δοκίμασε ξανά.','Plan not found.','It may have expired or been withdrawn. Ask your dietitian for a new link. If they just sent it, try again.',true)}
    if(data.expires_at && new Date(data.expires_at)<new Date()){return fail('Ο σύνδεσμος έληξε.','Ζήτησε από τον διαιτολόγο σου να στείλει νέο link.','This link has expired.','Ask your dietitian to send you a new link.')}
    SNAP=data.snapshot; SNAP._updated=data.updated_at;
    LANG=pickLang(SNAP.lang);
    applyLangMeta();
    render();
  }catch(e){
    // Δεν ξέρουμε ακόμη τη γλώσσα του πελάτη εδώ (το SNAP με το c.lang δεν πρόλαβε να φορτώσει,
    // αφού ακριβώς αυτό απέτυχε) — δείχνουμε το μήνυμα ΚΑΙ στα δύο, αντί να υποθέσουμε ελληνικά
    // και να αφήσουμε έναν αγγλόφωνο πελάτη μπλοκαρισμένο σε κείμενο που δεν διαβάζει.
    console.error('[FYH portal] boot failed:',e);
    fail('Πρόβλημα σύνδεσης.','Έλεγξε τη σύνδεσή σου στο ίντερνετ και δοκίμασε ξανά.','Connection problem.','Check your internet connection and try again.',true);
  }
}

// Χειροκίνητος έλεγχος για ενημερωμένο πλάνο (header button) — χωρίς αυτό, μια ήδη ανοιχτή καρτέλα
// (ειδικά αν έχει προστεθεί στην αρχική οθόνη σαν PWA) δεν βλέπει ποτέ νέο περιεχόμενο μετά από re-publish
// χωρίς πλήρες reload. Ξαναφορτώνει μόνο το snapshot και ξαναχτίζει το ΤΡΕΧΟΝ tab, όχι όλη τη σελίδα.
async function refreshPlan(){
  const t=token(); if(!t||!sb)return;
  const btn=$('#refresh-btn'); const icon=btn&&btn.querySelector('i');
  if(icon)icon.style.animation='sp .6s linear infinite';
  if(btn)btn.disabled=true;
  try{
    const {data,error}=await sb.rpc('get_shared_plan',{p_token:t}).single();
    if(!error&&data){
      SNAP=data.snapshot; SNAP._updated=data.updated_at;
      LANG=pickLang(SNAP.lang);
      applyLangMeta();
      const badge=$('#upd-badge'); if(badge)badge.innerHTML=updatedBadge();
      go(curTab());
    }else{console.error('[FYH portal] refreshPlan:',error);}
  }catch(e){console.error('[FYH portal] refreshPlan failed:',e);}
  if(icon)icon.style.animation='';
  if(btn)btn.disabled=false;
}

// PWA: manifest που κρατάει το token (ώστε το «Πρόσθεσε στην οθόνη» να ανοίγει το σωστό πλάνο).
function injectManifest(){
  try{
    const name=((SNAP&&SNAP.name||'').split(' ')[0])||'';
    var shortPrefix=({el:'Πλάνο ',en:'Plan ',ru:'План ',tr:'Plan '})[LANG]||'Πλάνο ';
    const m={name:'Feed Your Health — '+planAppName(),short_name:name?(shortPrefix+name):planAppName(),
      start_url:location.href,display:'standalone',background_color:'#f4f8f6',theme_color:'#025857',
      icons:[{src:"data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%23025857'/%3E%3Ctext x='90' y='120' font-family='Georgia,serif' font-size='86' font-weight='700' fill='%23E2EEE5' text-anchor='middle'%3EFY%3C/text%3E%3C/svg%3E",sizes:'180x180',type:'image/svg+xml',purpose:'any maskable'}]};
    const blob=new Blob([JSON.stringify(m)],{type:'application/manifest+json'});
    const old=document.querySelector('link[rel="manifest"]'); if(old)old.remove();

// tipField: ίδιο μοτίβο suffix-ανά-γλώσσα με τα supps στο _buildSnapshot (nameEn/doseEn/...) —

const TIP_LANG_SUFFIX={en:'En',ru:'Ru',tr:'Tr'};

// Ίδιο accordion μοτίβο/CSS με το faqCard() παραπάνω (.faq-item/.faq-q/.faq-a) — ο πελάτης δεν
// βλέπει κανένα νέο interaction pattern, απλά το περιεχόμενο είναι πια δυναμικό. Επιπλέον
// ομαδοποιεί οπτικά ανά κατηγορία (ίδιο .slcat-h μοτίβο με τις κατηγορίες στη Λίστα Ψώνια) —
// χωρίς αυτό μια βιβλιοθήκη με 20-30 tips θα ήταν μια αδιάκριτη μακριά λίστα να ξεφυλλίζει ο
// πελάτης. Η ετικέτα κατηγορίας μένει πάντα στα Ελληνικά (όπως τη γράφει ο διαιτολόγος) — δεν
// μεταφράζεται ακόμα σαν το title/body του κάθε tip, γνωστό μικρό compromise για τώρα.
function tipsCard(tips){

  tips.forEach(tip=>{

    groups[groupIdx[cat]].items.push(tip);
  });

    if(groups.length>1 && g.cat){
      const h=el('div','slcat-h',esc(g.cat));

function statBox(l,v,u,ok){if(ok===undefined)ok=/^[−-]/.test(u);return '<div class="stat"><div class="l">'+l+'</div><div class="v">'+v+'</div><div class="u'+(ok?' ok':'')+'">'+u+'</div></div>'}
function deltaU(p){if(p.start&&p.current){const d=Math.round((p.current-p.start)*10)/10;return (d<=0?'−':'+')+decSep(Math.abs(d).toString())+' kg'}return 'kg'}
// Ποσοστό προόδου προς τον στόχο βάρους — ΙΔΙΟΣ τύπος με το goalPct της dietologist-side εφαρμογής
// (js/app-part2.js, "Νέα κάρτα Στόχος βάρους"), ώστε το νούμερο που βλέπει ο πελάτης εδώ να ταιριάζει
// πάντα με αυτό που βλέπει ο διαιτολόγος στο δικό του appt-summary. Δουλεύει και για αύξηση βάρους
// (π.χ. μυϊκή μάζα) — όχι μόνο απώλεια — γιατί δεν υποθέτει κατεύθυνση, μόνο απόσταση από start/goal.
function goalRingPct(p){
  if(!(p.start&&p.current&&p.goal))return null;
  if(Math.abs(p.start-p.goal)<=0.05)return null;
  return Math.max(0,Math.min(100,Math.round((p.start-p.current)/(p.start-p.goal)*100)));
}
// Το ίδιο "κάρτα με ring" component/μαρκάπ σε όλο το app (βλ. pctRing() στο js/app-part1.js,
// Dietologist.html) — εδώ ξαναγραμμένο τοπικά επειδή το plan.html δεν έχει πρόσβαση σε εκείνο το
// αρχείο (ξεχωριστό deployment, βλ. σχόλιο πάνω από .pct-ring στο <style>).
function goalRingHtml(p){
  const pct=goalRingPct(p);
  if(pct==null)return '';
  const c=el('div','card');const cp=el('div','card-pad goalring-card');
  cp.innerHTML='<div class="pct-ring" style="--pr-size:64px;--pr-thick:8px;--pr-p:'+pct+'%">'
    +'<span class="pct-ring-label" style="font-size:15px">'+pct+'%</span></div>'
    +'<div class="txt"><div class="t">'+pct+'% '+T('progRingLbl')+'</div>'
    +'<div class="s">'+decSep(String(p.current))+' → '+decSep(String(p.goal))+' kg</div></div>';
  c.appendChild(cp);
  return c;
}
// Η κατεύθυνση αλλαγής βάρους είναι "καλή" ανάλογα με τον στόχο (goalWeight) του πελάτη —
// π.χ. σε πρόγραμμα μυϊκής αύξησης η αύξηση βάρους είναι επιθυμητή, όχι πάντα η μείωση.
function deltaGood(p){
  if(!(p.start&&p.current))return false;
  const d=p.current-p.start;
  if(d===0)return true;
  if(p.goal!=null&&p.goal!==p.start)return p.goal>p.start?d>0:d<0;
  return d<=0;
}
// Στιγμή δέσμευσης στόχου: δείχνεται ΜΙΑ φορά συνολικά (setGoalHeroSeen το κλειδώνει αμέσως).
// Αν ο διαιτολόγος δεν έχει ορίσει goalWeight για αυτόν τον πελάτη δεν υπάρχει τι να δείξουμε — καμία κάρτα.
function goalHero(){
  const p=SNAP.progress||{};
  if(getGoalHeroSeen()||!p.goal)return null;
  const start=p.start||p.current;
  if(!start||p.goal===start)return null;
  setGoalHeroSeen();
  const diff=Math.round(Math.abs(p.goal-start)*10)/10;
  const dirIcon=p.goal<start?'ti-trending-down':'ti-trending-up';
  const c=el('div','goalhero');
  c.innerHTML='<div class="lbl">'+T('goalHeroLbl')+'</div><div class="val">'+decSep(String(p.goal))+' kg</div>'
    +'<div class="arrow"><i class="ti '+dirIcon+'"></i>'+T('goalHeroArrow',{start:decSep(String(start)),diff:decSep(String(diff))})+'</div>';
  return c;
}
// «Πρόσθεσε στην αρχική οθόνη» — δείχνεται μόνο όταν είναι πραγματικά δυνατό (Android/Chrome
// έστειλε το beforeinstallprompt event, ή iOS Safari όπου δείχνουμε τα χειροκίνητα βήματα),
// ποτέ αν ο πελάτης το έχει ήδη εγκαταστήσει (standalone) ή το έχει κλείσει μία φορά.
function installBanner(){
  if(isStandalone())return null;
  try{if(localStorage.getItem(lk('installDismissed'))==='1')return null;}catch(e){}
  const ios=isIOS();
  if(!deferredInstallPrompt && !ios)return null;
  const c=el('div','inline-notice');
  c.innerHTML='<i class="ti ti-download in-ic"></i><div class="in-txt">'
    +'<div class="in-t">'+T('installTitle')+'</div>'
    +'<div class="in-s">'+(deferredInstallPrompt?T('installSubAuto'):T('installSubIOS'))+'</div>'
    +(deferredInstallPrompt?'<button class="in-btn" type="button">'+T('installBtn')+'</button>':'')
    +'</div><button class="in-x" type="button" aria-label="'+T('installClose')+'"><i class="ti ti-x"></i></button>';
  const btn=c.querySelector('.in-btn');
  if(btn)btn.onclick=async()=>{
    if(!deferredInstallPrompt)return;
    deferredInstallPrompt.prompt();
    try{await deferredInstallPrompt.userChoice;}catch(e){}
    deferredInstallPrompt=null;
    dismissInstallBanner();
  };
  c.querySelector('.in-x').onclick=()=>{dismissInstallBanner();go('home');};
  return c;
}

// Ήπια υπενθύμιση μέσα στην ίδια τη σελίδα όταν ο πελάτης δεν έχει τσεκάρει τίποτα ακόμα αργά
// μέσα στη μέρα — δεν χρειάζεται push/WhatsApp υποδομή, απλά ένα ευγενικό nudge όταν ήδη είναι εδώ.
// Κλείνει για τη ΣΗΜΕΡΙΝΗ μέρα μόνο (ξαναδείχνεται αύριο αν χρειαστεί).
function activityNudge(meals,done){
  if(!meals||!meals.length||done>0)return null;
  if(new Date().getHours()<14)return null;
  try{if(localStorage.getItem(lk('nudgeDismissed'))===todayKey())return null;}catch(e){}
  const c=el('div','inline-notice');
  c.innerHTML='<i class="ti ti-bell-ringing in-ic"></i><div class="in-txt">'
    +'<div class="in-t">'+T('nudgeTitle')+'</div>'
    +'<div class="in-s">'+T('nudgeSub')+'</div>'
    +'</div><button class="in-x" type="button" aria-label="'+T('installClose')+'"><i class="ti ti-x"></i></button>';
  c.querySelector('.in-x').onclick=()=>{try{localStorage.setItem(lk('nudgeDismissed'),todayKey())}catch(e){}go('home');};
  return c;
}

// Widget «με μια ματιά»: σκορ εβδομάδας / σερί / βάρος — tap πάει στην Πρόοδο.
// Κρύβεται εντελώς αν δεν υπάρχει καμία καταγραφή ή μέτρηση βάρους ακόμη (νέος πελάτης).
function glanceCard(){
  const s=SNAP, p=s.progress||{};
  const cur=pillarStats(weekDatesOffset(0),{upToToday:true});
  const score=cur.anyData?overallScore(cur):null;
  const streak=streakDays();
  const hasWeight=!!(p.start&&p.current);
  if(!cur.anyData && !streak && !hasWeight)return null;
  const wDelta=hasWeight?deltaU(p).replace(' kg',''):null;
  const cell=(v,l)=>'<div style="flex:1;text-align:center"><div style="font-size:19px;font-weight:700;color:var(--teal-d)">'+v+'</div><div style="font-size:11px;color:var(--muted);margin-top:2px">'+l+'</div></div>';
  const div='<div style="width:.5px;height:32px;background:var(--bord-l)"></div>';
  const c=el('div','card'); c.style.cursor='pointer'; c.onclick=()=>go('prog');
  const cp=el('div','card-pad');
  cp.style.cssText='display:flex;align-items:center;gap:4px';
  cp.innerHTML=
    cell(score==null?'—':score+'%',T('glanceScore'))
    +div+cell(streak>0?streak+' 🔥':'0',T('glanceStreak'))
    +div+cell(hasWeight?wDelta:'—',T('glanceWeight'));
  c.appendChild(cp); return c;
}

// 🥤 CHO Training Protocol card — renders SNAP.days[i].cho (server-baked & translated in
// _buildSnapshot). Returns null when the day has no cho block (rest day / feature off / old link).
function choCard(cho){
  if(!cho) return null;
  const c=el('div','cho-card');
  const col=(o)=>{
    const amt = o.applicable===false
      ? '<div class="amt" style="font-size:13px;color:var(--muted)">—</div>'
      : (o.perHour!=null
          ? '<div class="amt">'+nfmt(o.perHour)+'<small> '+esc(o.unit||'g/hr')+'</small></div>'
          : '<div class="amt">'+nfmt(o.grams||0)+'<small> g</small></div>');
    const tm = o.time ? '<div class="tm">'+esc(o.time)+(o.sub?' · '+esc(o.sub):'')+'</div>'
                      : (o.sub?'<div class="tm">'+esc(o.sub)+'</div>':'');
    const extra = (o.applicable!==false && o.total!=null)
      ? '<div class="tm">'+esc(o.approx||'~')+nfmt(o.total)+' g</div>' : '';
    return '<div class="cho-col"><div class="ph">'+esc(o.ph)+'</div><div class="lbl">'+esc(o.label||'')+'</div>'
      +tm+amt+extra+(o.eg?'<div class="eg">'+esc(o.eg)+'</div>':'')+'</div>';
  };
  const pre={...cho.pre,ph:'⚡'}, dur={...cho.during,ph:'🔥'}, post={...cho.post,ph:'💪'};
  c.innerHTML='<div class="ch-hd"><span>🥤</span><span>'+esc(cho.title||'')+'</span></div>'
    +(cho.sessionStart?'<div class="ch-sub">'+esc(cho.sessionStart)+'</div>':'')
    +'<div class="cho3">'+col(pre)+col(dur)+col(post)+'</div>'
    +(cho.why?'<div class="cho-why"><span>🎯</span><span>'+esc(cho.why)+'</span></div>':'')
    +(cho.note?'<div class="cho-note">'+esc(cho.note)+'</div>':'')
    +(cho.foot?'<div class="cho-foot">'+esc(cho.foot)+'</div>':'');
  return c;
}

    const p=el('div','pill'+(i===curDay?' on':''),shortDay(d.label));

        head.style.cursor='pointer';

// ✅ audit fix (2026-08-21): μόνο ελληνικά/αγγλικά substrings αναγνωρίζονταν εδώ — ένα ρωσικό/τουρκικό
// πλάνο (label ήδη μεταφρασμένο, βλ. [[dietologist-ru-tr-portal-prep]]) έπεφτε πάντα στο 's' (σνακ),
// άρα ΟΛΑ τα γεύματα του τυπωμένου πίνακα έβγαιναν με το ίδιο styling σνακ αντί για πρωινό/μεσημεριανό/
// βραδινό. 'akşam yemeği' (όχι μόνο 'akşam') ώστε να μην ταιριάζει σιωπηλά και το 'Akşam ara öğünü'.
function pMealType(label){
  const n=(label||'').toLowerCase();
  if(n.indexOf('πρω')>-1||n.indexOf('breakfast')>-1||n.indexOf('завтрак')>-1||n.indexOf('kahvalt')>-1)return'b';
  if(n.indexOf('μεσημ')>-1||n.indexOf('lunch')>-1||n.indexOf('обед')>-1||n.indexOf('öğle')>-1)return'l';
  if(n.indexOf('βραδ')>-1||n.indexOf('dinner')>-1||n.indexOf('ужин')>-1||n.indexOf('akşam yemeği')>-1)return'd';
  return's';
}

// ── PROGRESS (συνέπεια: διατροφή / συμπληρώματα / νερό + αυτόματες συμβουλές) ──
// Ποια ημέρα του πλάνου αντιστοιχεί σε μια ημερομηνία (JS day → plan index, Δευτέρα=0).
function planForDate(d){const map=[6,0,1,2,3,4,5];return (SNAP.days||[])[map[d.getDay()]]}
// Οι 7 ημερομηνίες (Δευτέρα→Κυριακή) μιας εβδομάδας. offset 0=τρέχουσα, -1=προηγούμενη …
function weekDatesOffset(offset){
  const now=new Date(); const js=now.getDay(); const toMon=(js===0?-6:1-js);
  const mon=new Date(now); mon.setDate(now.getDate()+toMon+offset*7); mon.setHours(0,0,0,0);
  const arr=[]; for(let i=0;i<7;i++){const d=new Date(mon);d.setDate(mon.getDate()+i);arr.push(d);} return arr;
}
// Συγκεντρωτικά ανά πυλώνα για ένα σύνολο ημερών. {upToToday} = αγνόησε μελλοντικές ημέρες.
function pillarStats(dates,opts){
  const s=SNAP, h=s.hydration||{}, per=h.glassMl||250;
  const mealsAll=(()=>{try{return JSON.parse(localStorage.getItem(lk('meals'))||'{}')}catch(e){return {}}})();
  const waterAll=(()=>{try{return JSON.parse(localStorage.getItem(lk('water'))||'{}')}catch(e){return {}}})();
  const suppAll=getSuppLog();
  const supCount=(s.supps||[]).length;
  const today=new Date(); today.setHours(23,59,59,999);
  const r={dietDone:0,dietTot:0,supDone:0,supTot:0,watDone:0,watTot:0,days:0,anyData:false};
  dates.forEach(d=>{
    if(opts&&opts.upToToday&&d>today)return;
    const pd=planForDate(d); if(!pd)return;
    r.days++;
    const k=dKey(d);
    const mealsN=(pd.meals||[]).length;
    let e=0; if(mealsN){r.dietTot++; const lg=mealsAll[k]||{}; for(let j=0;j<mealsN;j++)if(lg[j])e++; if(e>=mealsN)r.dietDone++;}
    let c=0; if(supCount){r.supTot++; const lg=suppAll[k]||{}; (s.supps||[]).forEach(su=>{if(lg[su.name])c++}); if(c>=supCount)r.supDone++;}
    const mi=matchInfoFor([6,0,1,2,3,4,5][d.getDay()],d);
    const goalMl=(mi.isMatch&&h.matchMl)?h.matchMl:(pd.isTrain&&h.trainMl)?h.trainMl:(h.baseMl||2000);
    const tg=Math.max(6,Math.round(goalMl/per)); const wn=waterAll[k]||0;
    r.watTot++; if(wn>=tg)r.watDone++;
    if(e>0||c>0||wn>0)r.anyData=true;
  });
  return r;
}
// Συνολικό σκορ = μέσος όρος των ποσοστών των πυλώνων που ισχύουν.
function overallScore(st){
  const ps=[]; if(st.dietTot)ps.push(st.dietDone/st.dietTot); if(st.supTot)ps.push(st.supDone/st.supTot); if(st.watTot)ps.push(st.watDone/st.watTot);
  if(!ps.length)return null; return Math.round(ps.reduce((a,b)=>a+b,0)/ps.length*100);
}
// Σερί: συνεχόμενες «τέλειες» ημέρες (όλοι οι πυλώνες ✓) μέχρι σήμερα — ΜΕ ένα «πάγωμα» τον μήνα:
// η πρώτη χαμένη μέρα μέσα σε έναν ημερολογιακό μήνα δεν σπάει το σερί (καλύπτεται αυτόματα),
// η δεύτερη μέσα στον ίδιο μήνα το σπάει κανονικά. Στόχος: μια κακή μέρα να μη μηδενίζει
// εβδομάδες συνέπειας, χωρίς να αδειάζει εντελώς το νόημα του σερί.
function streakInfo(){
  const s=SNAP, h=s.hydration||{}, per=h.glassMl||250;
  let mealsAll={},waterAll={}; try{mealsAll=JSON.parse(localStorage.getItem(lk('meals'))||'{}')}catch(e){} try{waterAll=JSON.parse(localStorage.getItem(lk('water'))||'{}')}catch(e){}
  const suppAll=getSuppLog(), supCount=(s.supps||[]).length;
  // 'good' | 'missed' | 'noplan' — ξεχωρίζουμε "δεν υπήρχε καν πλάνο τότε" (πριν ξεκινήσει ο
  // πελάτης· σταματάμε το μέτρημα εκεί, δεν είναι χαμένη μέρα) από "υπήρχε πλάνο, δεν έγινε".
  // Μια μέρα χωρίς ΚΑΜΙΑ καταγραφή (ούτε γεύμα, ούτε νερό, ούτε συμπλήρωμα) μετράει επίσης ως
  // 'noplan' — διαφορετικά το πάγωμα θα "έσωζε" αναδρομικά μέρες πριν καν ανοίξει ο πελάτης το
  // link του, αντί να καλύπτει μόνο μια πραγματική κακή μέρα.
  function status(d){
    const pd=planForDate(d); if(!pd)return 'noplan'; const k=dKey(d);
    const mLog=mealsAll[k], wLog=waterAll[k], sLog=suppAll[k];
    const touched=(mLog&&Object.keys(mLog).length)||(wLog!=null)||(sLog&&Object.keys(sLog).length);
    if(!touched)return 'noplan';
    const mealsN=(pd.meals||[]).length;
    if(mealsN){let e=0; for(let j=0;j<mealsN;j++)if(mLog&&mLog[j])e++; if(e<mealsN)return 'missed';}
    if(supCount){let c=0;(s.supps||[]).forEach(su=>{if(sLog&&sLog[su.name])c++}); if(c<supCount)return 'missed';}
    const mi=matchInfoFor([6,0,1,2,3,4,5][d.getDay()],d);
    const goalMl=(mi.isMatch&&h.matchMl)?h.matchMl:(pd.isTrain&&h.trainMl)?h.trainMl:(h.baseMl||2000); const tg=Math.max(6,Math.round(goalMl/per));
    if((wLog||0)<tg)return 'missed'; return 'good';
  }
  const monthKey=dd=>dd.getFullYear()+'-'+String(dd.getMonth()+1).padStart(2,'0');
  let n=0; const d=new Date(); d.setHours(0,0,0,0);
  let st=status(d);
  if(st!=='good')d.setDate(d.getDate()-1); // σημερινή μέρα σε εξέλιξη — ούτε μετράει ούτε σπάει τίποτα
  const usedFreezeMonths={};
  for(;;){
    st=status(d);
    if(st==='good'){n++;}
    else if(st==='missed'){
      const mk=monthKey(d);
      if(usedFreezeMonths[mk])break; // δεύτερη χαμένη μέρα τον ίδιο μήνα — το σερί σπάει κανονικά
      usedFreezeMonths[mk]=true; n++; // πάγωμα: η μέρα καλύπτεται, το σερί συνεχίζει
    }else break; // 'noplan' — πριν ξεκινήσει ο πελάτης, σταμάτα το μέτρημα εδώ
    d.setDate(d.getDate()-1);
    if(n>365)break;
  }
  return {days:n, freezeAvailable:!usedFreezeMonths[monthKey(new Date())]};
}

function milestoneCard(streak,freezeAvailable){

// Κοινοποίηση προόδου: native share όπου υποστηρίζεται, αλλιώς αντιγραφή στο clipboard με οπτική επιβεβαίωση.
function shareProgress(btn,score,streak){
  const parts=[T('shareText',{score:score})];
  if(streak>0)parts.push('🔥 '+T('shareStreak',{n:streak,dn:dayWord(streak)}));
  parts.push(T('shareFooter'));
  const text=parts.join(' ');
  if(navigator.share){
    navigator.share({text:text}).catch(()=>{});
  }else if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=>{
      const old=btn.innerHTML;
      btn.innerHTML='<i class="ti ti-check"></i>'+T('shareCopied');
      setTimeout(()=>{btn.innerHTML=old;},1500);
    }).catch(()=>{});
  }
}
// Αυτόματες συμβουλές βάσει αποτελεσμάτων (κανόνες, max 3).
function buildTips(cur,prev){
  const out=[], P=(d,t)=>t?Math.round(d/t*100):-1, dn=dayWord;
  const pillars=[
    {pct:P(cur.dietDone,cur.dietTot),miss:cur.dietTot-cur.dietDone,
      low:T('tipDietLow'), mid:T('tipDietMid'), ok:T('tipDietOk')},
    {pct:P(cur.supDone,cur.supTot),miss:cur.supTot-cur.supDone,
      low:T('tipSuppLow'), mid:T('tipSuppMid'), ok:T('tipSuppOk')},
    {pct:P(cur.watDone,cur.watTot),miss:cur.watTot-cur.watDone,
      low:T('tipWaterLow'), mid:T('tipWaterMid'), ok:T('tipWaterOk')}
  ];
  if(prev&&prev.anyData){
    const c=overallScore(cur), p=overallScore(prev);
    if(c!=null&&p!=null){const diff=c-p;
      if(diff>=5)out.push({t:'up',x:T('tipUp',{diff:diff})});
      else if(diff<=-5)out.push({t:'info',x:T('tipDown')});
    }
  }
  pillars.filter(p=>p.pct>=0&&p.pct<85).sort((a,b)=>a.pct-b.pct).forEach(p=>{
    if(out.length>=3)return;
    out.push({t:'warn',x:p.pct<50?p.low:p.mid.replace('{n}',p.miss).replace('{dn}',dn(p.miss))});
  });
  pillars.filter(p=>p.pct>=90).sort((a,b)=>b.pct-a.pct).forEach(p=>{ if(out.length<3)out.push({t:'ok',x:p.ok}); });
  if(!out.length)out.push({t:'ok',x:T('tipGoodWeek')});
  return out.slice(0,3);
}
function scoreGreeting(sc){
  if(sc==null)return T('greetStart');
  if(sc>=85)return T('greetExcellent'); if(sc>=70)return T('greetGood');
  if(sc>=50)return T('greetOk'); return T('greetNew');
}

// Ζώνες αναφοράς %BF — ΚΡΑΤΑ ΤΙΣ ΤΙΜΕΣ ΙΔΙΕΣ με το js/lib/bf-norms.js (BF_BANDS) της
// κύριας εφαρμογής· το plan.html είναι standalone (χωρίς κοινό script scope) οπότε δεν
// γίνεται import. Μοντέλο 5 ζωνών ACE/ACSM — ΧΩΡΙΣ διόρθωση ηλικίας· fallback όταν λείπει ηλικία.
function bfBands(sex){
  return sex==='F'
    ?[{lo:10,hi:13,col:'#1565C0'},{lo:14,hi:20,col:'var(--ok)'},{lo:21,hi:24,col:'#558b2f'},{lo:25,hi:31,col:'#f57c00'},{lo:32,hi:60,col:'#c62828'}]
    :[{lo:2,hi:5,col:'#1565C0'},{lo:6,hi:13,col:'var(--ok)'},{lo:14,hi:17,col:'#558b2f'},{lo:18,hi:24,col:'#f57c00'},{lo:25,hi:60,col:'#c62828'}];
}
// ── Gallagher et al. 2000 (Am J Clin Nutr 72:694-701, Table 4) — age×sex υγιή εύρη %BF.
// MIRROR του bfHealthByAge()/GALLAGHER_BF στο js/lib/bf-norms.js — κράτα τα νούμερα ίδια.
const GALLAGHER_BF={
  M:[{aLo:20,aHi:39,h:[8,19],o:25},{aLo:40,aHi:59,h:[11,21],o:28},{aLo:60,aHi:79,h:[13,24],o:30}],
  F:[{aLo:20,aHi:39,h:[21,32],o:39},{aLo:40,aHi:59,h:[23,33],o:40},{aLo:60,aHi:79,h:[24,35],o:42}]
};
function bfGalRow(sex,age){
  if(!(age>0))return null;
  const rows=GALLAGHER_BF[sex==='F'?'F':'M'];
  const a=age<20?20:(age>79?79:age);
  return rows.find(r=>a>=r.aLo&&a<=r.aHi)||rows[rows.length-1];
}
function bfHealthByAge(bf,sex,age){
  const row=bfGalRow(sex,age);
  if(!(bf>0)||!row)return null;
  let key; if(bf<row.h[0])key='low'; else if(bf<=row.h[1])key='healthy'; else if(bf<row.o)key='overfat'; else key='obese';
  const col={low:'#1565C0',healthy:'var(--ok)',overfat:'#f57c00',obese:'#c62828'}[key];
  return {key,col,healthy:row.h.slice(),obeseLo:row.o,ageBand:row.aLo+'–'+row.aHi};
}
// Ζώνες για το γράφημα τάσης — Gallagher 4 ζώνες αν υπάρχει ηλικία, αλλιώς ACE 5.
function bfBandsChart(sex,age){
  const row=bfGalRow(sex,age);
  if(!row)return bfBands(sex);
  return [{lo:0,hi:row.h[0],col:'#1565C0'},{lo:row.h[0],hi:row.h[1],col:'var(--ok)'},{lo:row.h[1],hi:row.o,col:'#f57c00'},{lo:row.o,hi:60,col:'#c62828'}];
}
function bfBandsLegend(sex,age){
  const row=bfGalRow(sex,age);
  let labels,bands;
  if(row){ labels=[T('bfGalLow'),T('bfGalHealthy'),T('bfGalOverfat'),T('bfGalObese')]; bands=bfBandsChart(sex,age); }
  else { labels=[T('bfEssential'),T('bfAthletic'),T('bfFit'),T('bfAcceptable'),T('bfObese')]; bands=bfBands(sex); }
  let items='';
  bands.forEach((b,i)=>{items+='<span style="display:inline-flex;align-items:center;gap:4px;margin-right:10px"><span style="width:8px;height:8px;border-radius:2px;background:'+b.col+';display:inline-block"></span>'+labels[i]+'</span>';});
  return el('div',null,'<div style="font-size:10px;color:var(--muted);margin-top:8px;line-height:1.8">'+items+'<div style="margin-top:2px">'+(row?T('bfGalRef'):T('acsmRef'))+'</div></div>');
}
// Μπάρα αναφοράς Low→High (ΔΜΣ/%Λίπους/WHtR) με ◆ δείκτη στόχου — ίδια λογική με το έντυπο λιπομέτρησης.
function rbPct(v,min,max){return Math.max(0,Math.min(100,(v-min)/(max-min)*100));}
function rbGradient(boundaries,max){
  const stops=[];
  boundaries.forEach((b,i)=>{
    const startPct=rbPct(b.v,boundaries[0].v,max);
    stops.push(b.col+' '+startPct.toFixed(0)+'%');
    if(i<boundaries.length-1){const endPct=rbPct(boundaries[i+1].v,boundaries[0].v,max);stops.push(b.col+' '+endPct.toFixed(0)+'%');}
  });
  return 'linear-gradient(90deg,'+stops.join(',')+')';
}
function rangeBar(label,valTxt,valCol,catTxt,boundaries,max,curVal,goalVal){
  if(!boundaries){
    return '<div style="margin-bottom:13px">'
      +'<div style="display:flex;justify-content:space-between;font-size:12px;color:var(--muted)"><span>'+label+'</span><b style="color:'+valCol+'">'+valTxt+'</b></div>'
      +'</div>';
  }
  const curPct=curVal!=null?rbPct(curVal,boundaries[0].v,max):null;
  const goalPct=goalVal!=null?rbPct(goalVal,boundaries[0].v,max):null;
  return '<div style="margin-bottom:13px">'
    +'<div style="display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:4px"><span>'+label+'</span><b style="color:'+valCol+'">'+valTxt+(catTxt?' · '+catTxt:'')+'</b></div>'
    +'<div style="height:8px;border-radius:4px;background:'+rbGradient(boundaries,max)+';position:relative">'
    +(curPct!=null?'<div style="position:absolute;left:'+curPct.toFixed(1)+'%;top:-3px;width:2px;height:14px;background:var(--ink)"></div>':'')
    +(goalPct!=null?'<div style="position:absolute;left:'+goalPct.toFixed(1)+'%;top:-9px;width:0;height:0;border-left:4px solid transparent;border-right:4px solid transparent;border-top:6px solid var(--teal-d)"></div>':'')
    +'</div></div>';
}
function fmtDateShort(iso){
  if(!iso)return '';
  const d=new Date(iso); if(isNaN(d))return '';
  return d.getDate()+'/'+(d.getMonth()+1);
}
function sparklineKey(log,key,goal,color,opts){
  opts=opts||{};
  const W=300,H=120,padL=8,padB=18,padT=8;
  const ys=log.map(x=>x[key]);let mn=Math.min(...ys),mx=Math.max(...ys);
  if(goal!=null){mn=Math.min(mn,goal);mx=Math.max(mx,goal)}
  if(mx-mn<1){mx+=0.5;mn-=0.5}
  const vpad=(mx-mn)*0.15; mn-=vpad; mx+=vpad;
  const sx=i=>padL+ (i/(log.length-1))*(W-padL-8);
  const sy=v=>padT+(1-(v-mn)/(mx-mn))*(H-padT-padB);
  let svg='<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="'+T('chartAriaLabel')+'">';
  if(opts.bands){
    opts.bands.forEach(b=>{
      const lo=Math.max(b.lo,mn), hi=Math.min(b.hi,mx);
      if(hi<=lo)return;
      const y1=sy(hi), y2=sy(lo);
      svg+='<rect x="'+padL+'" y="'+y1+'" width="'+(W-padL-8)+'" height="'+(y2-y1)+'" fill="'+b.col+'" opacity="0.12"/>';
    });
  }
  if(goal!=null){const gy=sy(goal);svg+='<line x1="'+padL+'" y1="'+gy+'" x2="'+(W-8)+'" y2="'+gy+'" stroke="#9fcabf" stroke-width="1" stroke-dasharray="3 3"/><text x="'+(W-46)+'" y="'+(gy-3)+'" font-size="8" fill="var(--teal-l)">'+T('chartGoalLbl')+'</text>'}
  let pts=log.map((x,i)=>sx(i)+','+sy(x[key])).join(' ');
  svg+='<polyline points="'+pts+'" fill="none" stroke="'+color+'" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>';
  svg+='<circle cx="'+sx(0)+'" cy="'+sy(log[0][key])+'" r="3" fill="'+color+'"/>';
  svg+='<circle cx="'+sx(log.length-1)+'" cy="'+sy(log[log.length-1][key])+'" r="4" fill="'+color+'"/>';
  svg+='<text x="'+padL+'" y="'+(H-4)+'" font-size="9" fill="var(--faint)">'+fmtDateShort(log[0].date)+'</text>';
  svg+='<text x="'+(W-8)+'" y="'+(H-4)+'" font-size="9" fill="var(--faint)" text-anchor="end">'+fmtDateShort(log[log.length-1].date)+'</text>';
  svg+='</svg>';
  const d=el('div');d.innerHTML=svg;return d;
}

  const c=el('div','water');
  const haveMl=have*per;
  c.innerHTML='<div style="display:flex;align-items:center;justify-content:space-between"><div style="display:flex;align-items:center;gap:8px"><i class="ti ti-droplet" style="color:var(--teal);font-size:18px"></i><span style="font-size:14px;font-weight:600;color:var(--teal-d)">'+T('waterLabel')+'</span></div><span style="font-size:12px;color:var(--teal-l)">'+L(haveMl)+' / '+L(goalMl)+'</span></div>';
  const g=el('div','glasses');
  for(let i=0;i<totalGlasses;i++){
    const gl=el('span','glass'+(i<have?' on':''),i<have?'':''); // ti-glass-full / ti-glass (use class instead)
    gl.innerHTML=glassSVG(i<have);
    gl.onclick=()=>{const n=(i<have)?i:i+1;setWater(n);pushCheckin();go(curTab())};
    g.appendChild(gl);
  }
  c.appendChild(g);
  if(mi.isMatch&&h.matchMl)c.appendChild(el('div','swap-note',T('waterMatchNote')));
  if(!mini)c.appendChild(el('div','empty-glass-note',T('waterHint')));
  return c;
}
function curTab(){return curView}
// clean water-glass (tumbler) icon — empty = outline, full = with water
function glassSVG(on){
  const stroke=on?'#025857':'#a9c2bc';
  const water=on?'<path d="M7.25 11 L16.75 11 L15.7 19.3 Q15.55 20.6 14.2 20.6 L9.8 20.6 Q8.45 20.6 8.3 19.3 Z" fill="#7ec6bf"/>':'';
  return '<svg viewBox="0 0 24 24" width="32" height="32" aria-hidden="true">'
    +water
    +'<path d="M5.4 3.6 L18.6 3.6 L16.9 19.4 Q16.7 21 14.9 21 L9.1 21 Q7.3 21 7.1 19.4 Z" fill="none" stroke="'+stroke+'" stroke-width="1.5" stroke-linejoin="round"/>'
    +(on?'<line x1="7.4" y1="11" x2="16.6" y2="11" stroke="#025857" stroke-width="1.1" opacity="0.5"/>':'')
    +'</svg>';
}

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}

boot();
</script>
